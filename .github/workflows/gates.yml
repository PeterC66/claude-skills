name: Bus leaflet gates

# The engine's own gate suite: the unit tests and their mutation harnesses, and a
# byte gate over the small map estate this repository owns at
# `make-bus-leaflet/test/fixtures/estate/`.
#
# NO SECRET IS NAMED IN THIS FILE, SINCE 2026-09-18 (buses-data OA-398, R5 of the
# 2026-09-17 process review). The `status` job used to clone the PRIVATE
# PeterC66/buses-data with CROSS_REPO_PAT2 and gate its twenty-one maps. That
# token expires on Sunday 22 November 2026, and `status` is a required check here
# with strict mode and enforce_admins both on, so its expiry would have blocked
# every pull request in this repository outright, with no escape but a person
# turning branch protection off.
#
# THE HISTORY IS KEPT BECAUSE THE FAILURE MODE IS THE ESTATE'S, NOT THE TOKEN'S.
# Naming one repository when two were needed is what made this workflow red from
# 2026-08-04 to 2026-08-24: the token in the store could read buses-data and could
# not see the portal, so the run died at the portal checkout having gated nothing.
# A token that cannot see a repository fails identically to an expired one, and a
# green run says nothing about whether the credential is right. That is why a
# preflight stood in the `status` job for six weeks, and why the honest answer in
# the end was to stop reaching across at all. IF A FUTURE STEP HERE WANTS A
# PRIVATE REPOSITORY, the question to ask first is whether what it wants could be
# vendored instead.
#
# WHERE THE TOKEN WENT, in order. The `docs` job stopped needing it on 2026-09-04,
# when OA-246 moved both document checkers out of the private repository into
# `tools/` here beside `check-file-hygiene.mjs` and folded those steps into
# `unit`. The portal checkout stopped needing it the same day (OA-236), that
# repository having been made public on 2026-09-03. The `status` job was the last
# reader, and OA-398 removed it. The direction was the rule all along: A SHARED
# CHECK BELONGS IN THE REPOSITORY ANYONE CAN READ.
#
# WHAT RUNS OVER THE REAL ESTATE NOW is buses-data's own `gates.yml`, which checks
# this public repository out with no credential, at a commit recorded in a lock
# file rather than floating on `main`. Four steps moved there in the same change --
# the S6 falsification, the render sweep, the exclusion-parity join's real half and
# the stray-output sweep -- each with the reason written where it left.

# ONE RUN PER REF PER EVENT (2026-09-03). The portal's four workflows each grew
# this block on 2026-09-03 (buses-data OA-232 Tier 2.3) and the two `gates.yml`
# files -- the expensive ones -- were missed. Measured over the last 248 pushes
# here: 18 runs (7%) were still going when the next push arrived, and over in
# buses-data it was 77 of 246 (31%). A superseded run is not merely wasted; it can
# finish AFTER the run that replaced it and be the last verdict a reader sees.
# `cancel-in-progress` is safe for every job in this file because none of them
# writes anything outside its own runner -- these are checks, not deploys.
#
# THE GROUP INCLUDES THE EVENT NAME, and that is load-bearing rather than tidy.
# With only workflow+ref in the group, a push landing during a SCHEDULED run
# cancels it -- and in buses-data's copy of this file the nightly run is now the
# thing that guarantees the falsification harnesses execute at all. A push must
# not be able to cancel the run that carries a guarantee, so `schedule`, `push`,
# `pull_request` and `workflow_dispatch` each queue against themselves only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The unit suite needs NO repository but this one, so it must not sit behind the
  # cross-repo checkout: a CROSS_REPO_PAT2 expiry would otherwise take 423 tests
  # down with the byte gates, and the token expires on a known date (22 Nov 2026).
  # buses-data learned exactly this and split its `docs` job out for the same
  # reason. Added 2026-08-29 with OA-141, on measuring that `node --test` had
  # never run in CI at all -- 30 test files and 423 assertions whose only evidence
  # of passing was somebody remembering to run them on the laptop they were
  # written on. The three harnesses below are the ones that need no dataset and no
  # built map; the rest stay in `status`, where their fixtures are.
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claude-skills (engine)
        uses: actions/checkout@v7
        with:
          path: skills

      # WHICH NODE? THE ONE THE PRODUCT RUNS (buses-data OA-209, 2026-08-31).
      #
      # This said 20 until 2026-08-31 while the deployment image has been
      # `FROM node:24-slim` since August. A hardcoded major keeps passing after a
      # base-image bump while quietly testing a runtime the product never runs --
      # the same lesson buses-data's `gates.yml` and the portal's `verify.yml`
      # both carry, and this was the third repository it had not reached.
      #
      # The `status` job below DERIVES the major from the portal's Dockerfile,
      # which is the better pattern and the one to copy. This job cannot: it
      # checks out `skills` alone, and reading the Dockerfile would mean giving
      # the one job with NO secrets a cross-repo token -- so a CROSS_REPO_PAT2
      # expiry would take the unit suite down with the byte gates, which is
      # exactly the coupling the docs job in buses-data was split out to avoid.
      # A literal that is WRONG and self-maintaining beats a literal that is
      # right today and maintained by remembering; here the trade goes the other
      # way, so it is written down instead.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: skills/make-bus-leaflet/package-lock.json

      - name: Install engine dependencies
        working-directory: skills/make-bus-leaflet
        run: npm ci

      - name: Unit suite
        working-directory: skills/make-bus-leaflet
        run: npm test

      # THE PYTHON HALF, WHICH `npm test` CANNOT REACH. `npm test` is `node --test`,
      # so twenty of the engine's files -- every GTFS query, the NaPTAN resolvers, the
      # boarding index, the monthly refresh -- were carried entirely by the byte gates
      # until 2026-09-11 (buses-data OA-001). A byte gate asks only *does the output
      # still match*, which says nothing about a file no committed map runs: that is
      # exactly how gen_external_busway.js threw at load for a day with every gate in
      # three repositories green. test_module_load.py is that question asked of the
      # Python half, over a population DERIVED from the directory rather than typed.
      # The harness runs FIRST, because a suite that has never been seen to go red is
      # the thing this project keeps paying for.
      #
      # THIS PARAGRAPH USED TO END "ubuntu-latest already has python3", AND THAT WAS
      # THE WHOLE OF THE THOUGHT -- so the suite's first run here went red on
      # `ModuleNotFoundError: No module named 'docx'`, from gen_disagreements.py and
      # gen_verification.py, which have imported python-docx for a year on the one
      # laptop that has it. The control failed and the harness stopped without asking
      # a single mutation. requirements.txt declares that dependency now, setup-python
      # pins the interpreter to the laptop's 3.13 rather than whatever the image
      # happens to ship, and test/python/test_dependencies.py is the join: it fails if
      # the engine imports something this file does not install, or if this step ever
      # stops running before the suite.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: skills/make-bus-leaflet/requirements.txt

      - name: Install the engine's Python dependencies
        working-directory: skills/make-bus-leaflet
        run: pip install -r requirements.txt

      - name: Prove the Python unit suite can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-python

      - name: Python unit suite
        working-directory: skills/make-bus-leaflet
        run: npm run test:python

      # stamp-docs' own harness, and it had never run anywhere but a laptop
      # (buses-data OA-333). It falsifies the shared exclusion baseline, the JOIN
      # between the three scripts that read it, and -- since 2026-09-13 -- the rule
      # that a run walks only the root containing the working directory. That last
      # one is a SCOPE rule, which is this estate's most-repeated failure shape: it
      # goes wrong silently, the tool keeps working, and it quietly covers a
      # different set of files. It is in no package.json because stamp-docs has
      # none, so it is invoked directly rather than through an npm script.
      - name: Prove the stamp policy and its scope rule can go red
        working-directory: skills/stamp-docs
        run: python scripts/prove_policy.py

      # buses-data OA-397 (2026-09-18): the stamp is written at commit time by the
      # pre-commit hook, so a committed stamp describes its committed content by
      # construction. This drives `docstamp.py --staged` through REAL hooks and real
      # commits in a throwaway repository named by its own policy file, and its
      # mutation arm runs the same mid-turn edit through a hook that does not stamp
      # and requires the audit to refuse -- without that, "the audit never fires
      # now" and "the audit is broken" would look the same.
      - name: Prove stamping at commit time makes the committed stamp describe its commit
        working-directory: skills/stamp-docs
        run: python scripts/prove_staged.py

      # Falsification harnesses that need no other repository. Each breaks its own
      # subject on purpose and asserts WHICH tests go red while a named CONTROL
      # stays green -- a suite that only ever goes green proves nothing about the
      # guard it is pointed at.
      - name: Prove the build-warning severities can still go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-build-log

      # The line-count ratchet (buses-data OA-224, Tier 2.1). gen_internal.js was cut
      # 3,933 -> 2,550 on 2026-08-27 with a written rule that new logic goes in a
      # module; it was 3,293 by 2026-09-01. A rule in prose is a wish. The harness
      # runs FIRST: a ratchet nobody has watched go red is a number in a file.
      - name: Prove the line-count ratchet can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-line-ratchet

      # OA-344. `test/asset_load.test.js` asks the cheapest question there is -- does the
      # file load -- of EVERY file in assets/, where generator_load.test.js asked it of the
      # seven in the engine hash. The mutation it has to survive is a LOAD failure and not a
      # behaviour one: a test that passed because the file merely EXISTS would be the same
      # hole one level up, so case 1 plants the busway fault verbatim.
      - name: Prove the asset-load test can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-asset-load

      - name: The generators have not grown past their ceilings
        working-directory: skills/make-bus-leaflet
        run: npm run gate:line-ratchet

      # THE MUTATION SUITE, WHICH HAD NEVER RUN HERE. `npm test` above is
      # `node --test` -- it proves the unit tests pass. This breaks the engine on
      # purpose, once per mutation (read the count off the run, not off this
      # comment -- it said 226 for five days after it was 249), and requires each
      # mutation to redden the test that
      # names it: it proves the unit tests can FAIL, which is the only thing that
      # makes their green mean anything. `git log -S "prove-red.js"` over this
      # file returns nothing, so until 2026-09-02 the only machine that had ever
      # seen it was the one it was written on -- the exact fault OA-218 fixed for
      # the OTHER two harnesses on 2026-08-28, one file short. Found by
      # `gate:wiring` below, on its first run. ~90 s, no other repository.
      - name: Prove the unit suite can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red

      # AND PROVE THAT THE STEP ABOVE CAN SAY IT DID NOT RUN (buses-data OA-353).
      # `prove-red.js` stops before mutating anything if the unmutated copy is
      # already red -- correctly, since a mutation measured against a failing copy
      # proves nothing. Until 2026-09-14 that stop printed one ordinary line and
      # exited 1, exactly like `a mutation SURVIVED`, and it hid a whole day in
      # which the answer to *can these mutations fail?* was nobody has asked. It
      # now exits 2 and says `0 of N mutations ran`. Seven cases: five drive the
      # verdict with a stub runner in milliseconds, and two run
      # `prove-red.js --baseline-only` end to end -- green here, and red on a
      # scratch copy of the skill with one baseline suite deliberately broken,
      # because the first five would all pass against a module nothing called.
      # ~60 s, no other repository.
      - name: Prove the mutation harness can say it DID NOT RUN
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-baseline

      # The convention `_engine.js` and test/README.md have both stated since
      # August, now with something enforcing it. A suite that requires its subject
      # out of assets/ directly never sees the mutation copy, so it is green about
      # code it never ran -- `seed_prev_s4`'s first draft did exactly that and both
      # its mutations SURVIVED. The census runs in `npm test`; this proves it can
      # fail, including the case where the mutation table has become unreadable and
      # the JOIN has nothing left to join. ~5 s.
      - name: Prove the engine-indirection census can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-engine-indirection

      # The octolinear schematizer has no non-crossing constraint, so it can draw a
      # route crossing itself where the ground does not (buses-data OA-240). The
      # detector is standalone and deliberately OUTSIDE the engine hash closure --
      # `schematic_crossings.test.js` holds that line -- so it costs no rollout. It
      # runs here rather than in `status`: `ci-reference/` mirrors an S4 run but
      # carries no `schematic/` workspace, so the estate sweep has nothing to read
      # in a fresh clone and the suite works on fixtures it builds itself. Thirteen
      # mutations plus an equivalent-mutant control that must stay green. ~15 s.
      - name: Prove the schematic self-crossing detector can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-schematic-crossings

      - name: Prove the S4 run-directory guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-stage-run-dir

      - name: Prove the design-key register check can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-design-keys

      - name: Every design.* key the engine reads is in the register
        working-directory: skills/make-bus-leaflet
        run: npm run gate:design-keys

      - name: Every tracked file is LF
        working-directory: skills/make-bus-leaflet
        run: npm run gate:line-endings

      # The check that keeps this list honest. Every runnable tool must have an
      # npm script, every test:/gate: script must be in a workflow step or
      # declared with a reason, and CI must invoke each one THROUGH its script
      # rather than rebuilding the command -- four python harnesses were `python`
      # in package.json and `python3` here, so `npm run <name>` and the step of
      # the same name were different commands.
      # Falsify the scheduling check before trusting it. It is a check whose
      # subject is OTHER checks being scheduled, so if it stops finding things it
      # reports the healthiest possible state about a repository where nothing
      # runs. Seven cases on scratch repositories under the temp dir, ~2 s. The
      # one that matters is a control rather than a break: a tool named only in a
      # COMMENT must still count as unscheduled, because this workflow is heavily
      # commented and a grep over it would call every mention a schedule.
      - name: Prove the scheduling check can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-wiring

      - name: Every gate and harness is scheduled, and scheduled by name
        working-directory: skills/make-bus-leaflet
        run: npm run gate:wiring

      # BUS-WORK'S FOUR HARNESSES, which ran nowhere but this laptop until
      # 2026-09-02 (buses-data OA-224, Tier 2.3). Each builds its own scratch
      # tree under the temp dir and imports node builtins only, so they need no
      # install, no secrets and no other repository -- which is exactly why there
      # was never a reason for them to be missing, only an absence of anywhere
      # obvious to put them. bus-work now has a package.json that NAMES them.
      - name: Prove the commitment reminders can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-commitments

      # buses-data OA-396 (2026-09-17). The board stopped reddening on a pending
      # deploy that day, so the worklist row is now the ONLY thing that chases a
      # merge nobody deployed -- which is why its falsifier runs here and not
      # only on the laptop. Stubs for git and the live site; no network.
      - name: Prove the deploy-pending row can appear and stay quiet
        working-directory: skills/bus-work
        run: npm run test:prove-red-deploy-pending

      # buses-data OA-402 (2026-09-18), R9. The BODS-scan row is the only thing
      # that can say the monthly refresh did not RUN -- every other refresh row
      # on the board is a JOIN on the report that run writes, so a stale scan and
      # a quiet month are the same picture and a source that silently never fires
      # reads as good news for ever. Its falsifier belongs where a change to it is
      # seen. One directory listing, injected; no _gtfs folder and no network.
      - name: Prove the BODS-scan row can appear and stay quiet
        working-directory: skills/bus-work
        run: npm run test:prove-red-bods-scan

      # buses-data OA-426 (2026-09-22), R9 item 2. The refresh GRADE is the fact a
      # tick will rebuild a town on: SAFE means the scan found nothing needing a
      # judgement. A grade that never arrives costs a chore; a grade that arrives
      # from the WRONG RUN is a machine saying "no person needed" about changes
      # nobody has read, which is why the date rule has a mutation arm of its own.
      # The file reader is injected; no _gtfs folder, no clock and no network.
      - name: Prove the refresh grading reaches a row, and refuses when it should
        working-directory: skills/bus-work
        run: npm run test:prove-red-refresh-grades

      # buses-data OA-427 (2026-09-22), R9 item 3. *Human touches per map-month* is
      # the number R9's recommendation is judged on, and it was a refusal until the
      # manifests started recording who performed each stage. The failure that
      # matters is not a wrong rate but a CONFIDENT one -- a rate over attributed
      # runs read as a rate over the estate, or an unrecorded run counted as a tick
      # because the loop does most of the work. Both have a mutation arm. Literal
      # manifests and a literal clock; no Areas folder and no disk.
      - name: Prove who performed a stage can be counted, and can refuse to be
        working-directory: skills/bus-work
        run: npm run test:prove-red-stage-actors

      # buses-data OA-402 (2026-09-18), R9. The five numbers R9 is judged on. Two
      # of the five refuse to be computed and say why, and the harness is what
      # holds them to it -- both faults it has already caught produced a PLAUSIBLE
      # number rather than an error. Stubs throughout; gh is never called.
      - name: Prove the five routine numbers are what their labels say
        working-directory: skills/bus-work
        run: npm run test:prove-red-routine-numbers

      - name: Prove the concurrency verdicts can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-concurrency

      - name: Prove the correspondence reminders can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-correspondence

      - name: Prove the refresh-review row can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-refresh-review

      - name: Prove the complexity band on a map request can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-complexity-band

      # buses-data OA-417 (2026-09-21): the "waiting on you in the portal" block.
      # A projection over rows already on the board, so the only way it can be
      # wrong is by disagreeing with the list under it -- and its last section
      # greps the PORTAL's own row builder, which is what would catch the step
      # kind being renamed and the block going silently, greenly empty.
      - name: Prove the portal-clicks block can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-portal-clicks

      # buses-data OA-233 (2026-09-05): the two landmark-answer rows, and the wire
      # that adds them, asserted on the source of the wire as well as the module.
      - name: Prove the landmark-answer rows can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-landmark-answers

      # buses-data OA-251 (2026-09-05): the CI-red worklist row. Nine sections over
      # run FIXTURES -- no gh, no network, no GitHub account -- because the verdict
      # is what can be wrong, not whether the GitHub CLI works.
      - name: Prove the CI-red row can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-ci-state

      # buses-data OA-283 (2026-09-08): the scheduled loop's loop/blocked/ rows and
      # the hold one of them can place on another row. ITS SUBJECT DOES NOT SURVIVE
      # actions/checkout -- `loop/` is gitignored in buses-data apart from its
      # README, so the folder is ABSENT here by construction and this step can only
      # ever exercise the silence. That is worth having (the silence is a
      # requirement, and a throw would break every board), but it is not the whole
      # check: the harness builds real folders under the temp dir so the rows and
      # the hold are falsified too, and a mutation sweep on this laptop watched all
      # eight mutations go red. Read this step as proving the module, not the estate.
      #
      # buses-data OA-401 (2026-09-18) merged this step with the one that followed
      # it. The drop zone at the top of loop/adhoc/ and loop/blocked/ became one
      # folder, loop/your-move/, and the FILE now says whether it is a hold or a
      # draft rather than the folder it sits in -- so the two harnesses became one,
      # and its new cases include the control that the partition is total and
      # disjoint. `loop/adhoc/ready/`, `doing/` and `done/` are still a separate
      # channel and still asserted NOT to be counted.
      - name: Prove the loop/your-move/ holds and drafts can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-loop-your-move

      # buses-data OA-287 (2026-09-08): the scheduled loop's mutex, loop/LOCK.d,
      # read so that a MANUAL session can see it. SAME CHECKOUT PROBLEM AS THE STEP
      # ABOVE and one degree worse -- `loop/` is gitignored in buses-data, so the
      # lock is ABSENT here by construction, and a rule that threw or delayed on a
      # missing folder would take every board down everywhere but that laptop. The
      # harness builds real lock directories under the temp dir for the rest. Its
      # four GREEN cases are the ones to read: held-by-me, a stale tick's lock, a
      # row that needs nothing, and no loop/ at all. Each is a way this rule could
      # silently break something that already works -- the second would have
      # disabled the loop's own crash recovery by stopping a tick at step 2 before
      # it reached the steal rule at step 3.
      - name: Prove the scheduled loop's lock verdict can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-loop-lock

      # buses-data OA-288 (2026-09-09): is the loop DOING anything. The third fact
      # about it, after "these items need you" (OA-283) and "a tick is running now"
      # (OA-287) -- and the one nothing read, because a HALTED loop holds no lock,
      # so loop_lock reports present:false, which is what it reports when all is
      # well. Same checkout caveat as its two siblings: `loop/runs/` is gitignored,
      # so this step can only ever exercise the SILENCE here, and the harness
      # builds real directories under the temp dir for everything else. Read its
      # three GREEN cases first -- a working tick clears the row, one stop is below
      # the threshold, and a merely OLD newest run raises nothing at all, because
      # the scheduler fires only while the desktop app is open and "nothing since
      # 01:15" is every morning. A row that nags daily is one nobody reads.
      - name: Prove the halted-loop row can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-loop-runs

      # buses-data OA-153 (2026-09-10): town_status.mjs answers "what is the status
      # of <map>?" and three of its four answers are NEGATIVES -- not on the public
      # site, no thread names it, nothing outstanding -- which look identical whether
      # the check works or does nothing. Every case is paired with the positive that
      # proves it can fire. It stands up its own stub portal on a loopback port, so
      # it needs no network, no secret and no other repository.
      - name: Prove the one-map status report can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-town-status

      # buses-data OA-308 (2026-09-11): the monthly reminder to sweep the national
      # bus-map directory's links, and the row ranking any DEAD one. The CHECK it
      # reminds you about is deliberately not in CI anywhere -- a council page dying
      # on a Tuesday must not redden a branch nobody pushed to -- but the ROW is a
      # pure function of a dated record on disk, so falsifying it here costs nothing
      # and reads no network. Its section 12 joins the real writer in buses-data to
      # this reader and SAYS IT IS SKIPPED here, because that repository is absent
      # from this checkout; read this step as proving the module, not the join.
      - name: Prove the bus-map directory's link rows can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-directory-links

      # buses-data OA-317 (2026-09-12): the step above proves a URL still RESOLVES.
      # This one is about what the page SAYS, which is the half the sweep cannot see --
      # a council quietly adding a town map to a page we already record reports LIVE
      # for ever, so OA-315's `coverage.mjs --check` stays green because nobody looked.
      # The row narrows to the authorities `existing-coverage.json` actually names (two
      # today, across all 20 maps) rather than all 76, and asks a PERSON to re-read them
      # quarterly. Like its sibling the row is a pure function of two dated files on
      # disk, so falsifying it here costs nothing and opens no socket -- but the ROW
      # itself must never become a CI step, because a staleness measure is a function of
      # the clock and would redden `main` on the calendar (OA-289). Its section 10 joins
      # the real buses-data files to this reader and SAYS IT IS SKIPPED here, that
      # repository being absent from this checkout. Read the two SILENT-ON-PURPOSE
      # sections first: an unmatched `lta` and an unparseable register are already faults
      # of `coverage.mjs --check` in buses-data's own gates, and one fault printed twice
      # under two names is worse than one.
      - name: Prove the coverage-gate freshness row can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-directory-coverage

      # buses-data OA-312 (2026-09-16): the /maps search resolves every named place
      # in Great Britain out of a vendored ONS Index of Place Names, republished
      # roughly yearly. Nothing in CI may ask how old that edition is (OA-289), so a
      # worklist row asks a person twice a year. Falsifying the ROW costs nothing and
      # opens no socket; the row itself must never become a step.
      - name: Prove the place-lookup edition row can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-directory-places

      # buses-data OA-307 step 2 (2026-09-12): every decided entry in the service-facts
      # register carries a `recheckBy`, and since today a researched operator coverage
      # row does too -- eighteen dates that NOTHING enumerated. check-s6-claims.mjs
      # deliberately refuses to say which are DUE: a gate comparing a stored date to
      # today reddens `main` on the calendar with nobody committing anything (OA-289,
      # measured once a day for as long as a claim was held). So the checker hands over
      # the dates bare and the BOARD takes the verdict -- and that split is only safe if
      # the board half is watched firing, which on the real register it cannot be: its
      # earliest date is 2026-12-08, so the row has never once appeared. This harness
      # builds a throwaway git repository, because the checker enumerates from
      # `git ls-files` and answers `notARepository` over anything else -- a plain temp
      # directory would make every case quietly absent, which is a harness proving
      # nothing. Read its two QUIET cases first: a date a year away says nothing, and a
      # date moved forward -- which is what answering a recheck does -- takes the row away.
      - name: Prove the register-recheck row can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-register-recheck

      # buses-data OA-326 (2026-09-12): committed work that has never been pushed.
      # The scheduled loop is DENIED the push by design, and that containment is
      # the reason it may write to these trees at all -- but nothing enumerated the
      # residue, so 463 insertions with their own harness sat on a portal branch
      # with no pull request while the board printed "community-bus-maps -- main,
      # clean". UNLIKE most steps here the subject DOES survive actions/checkout,
      # but only as an empty one: a fresh clone has a single branch, so this step
      # would be green for ever over the real tree. It is green over FIXTURES
      # instead -- the harness builds a bare origin, a clone, a worktree and a
      # squash-merge history under the temp dir. Read its five CONTROLS first:
      # four of the assertions exist to prove the row stays SILENT for finished
      # work, which is the only way this source can realistically fail.
      - name: Prove the stranded-branch row can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-unpushed-branches

      # buses-data OA-326 item 1 (2026-09-21): the half the step above says at
      # the point of its own narrowing that it does not ask. The stranded row
      # stops at the remote -- a branch that HAS been pushed raises nothing,
      # whether or not a pull request is open for it -- and on 2026-09-21 that
      # was judged too weak: portal #170 was open for 21 days and named on no
      # list until the day it merged, dependabot #64 has been open for 31, and
      # the one tick that went looking reported #170 as having never had a pull
      # request at all, because it inferred absence from a list it had already
      # filtered to OPEN. THE SUBJECT SURVIVES actions/checkout NOT AT ALL, so
      # every case is against a stub: the record is written under the temp dir
      # and GitHub is a function. Read section 11 first -- it is the one that
      # holds the shape in place, asserting that the half worklist.mjs imports
      # contains no call that can reach the network, because a board opening a
      # socket per branch is a board that fails on a train and is the one change
      # OA-326 argues hardest against.
      - name: Prove the pull-request sweep can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-pr-sweep

      # buses-data OA-343 (2026-09-14): the push preflight, which answers "what
      # would go red if I pushed now". Read case 2 first and read it as the
      # POINT of the tool rather than as one assertion among thirty: a preflight
      # that stopped at the first failure would satisfy every other case here and
      # still be the fault it was built to remove, because CI's own job ordering
      # is what hid three of the four blockers that kept `buses-data` red for
      # seven hours. So the assertion is on how many checks RAN, which no verdict
      # can express. Case 3 is the other half -- a check whose tool is missing is
      # UNANSWERED and takes the exit code with it, never a pass -- and case 4
      # holds that a check printing a reassuring last line and exiting 1 is a
      # FAIL, which is this repository's own refusal-that-depended-on-how-you-
      # read-it met a third time.
      - name: Prove the push preflight can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-preflight

      # buses-data OA-345 (2026-09-17): `engine.mjs` is this skill's ONE path
      # resolver and argument parser, and eight modules written after it did not
      # import it -- its importer count was still the two files it was cut from.
      # The 2026-09-14 review's conclusion is that the unit of an extraction is
      # the module PLUS the check on its callers, so the census is the half that
      # was missing and this step is what keeps it. The harness runs first
      # because it is the thing that says the census can fire at all: its
      # section 7 copies the real assets/ folder, puts back the exact literal
      # this action removed from `town_status.mjs`, and requires the census to
      # name it. A census whose control sits outside its own population is the
      # fault `make-bus-leaflet/test/cli.test.js` carried until 2026-09-14.
      - name: Prove the engine-adoption census can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-engine-adoption

      - name: Every bus-work module reaches the engine through engine.mjs
        working-directory: skills/bus-work
        run: npm run gate:engine-adoption

      - name: Prove the route-number collision guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-route-collision

      # OA-204: gtfs_query.py read operating days from the `calendar` row and folded
      # calendar_dates additions in only for a service with NO calendar row. GTFS lets
      # both tables define the answer, so a Mon-Fri base that adds every weekend as an
      # exception read Mon-Fri -- High Wycombe route 300, which would have printed 'no
      # Sunday bus' onto a sheet where 12 Sunday journeys run. No byte gate could see it:
      # the gate compares the drawing with ci-reference, not with the world. This harness
      # re-runs the OLD derivation beside the new one and requires it to stay wrong, so
      # the fix is shown to differ from the code that had the bug. Feed is synthetic and
      # in-memory: no dataset, no built map. Added 2026-08-31.
      - name: Prove the operating-days resolution can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-days-resolution

      # OA-223: gtfs_refresh_report.py folded 1A/1B into 1 and 32A into 32 -- right, and
      # what stops 301S being proposed as new every month -- recorded what it folded in
      # `variants`, and then read that set nowhere. A town that SHIPS a variant as a
      # displayed service was told every month that it had been withdrawn, and the base's
      # week became the union of services the town separates. High Wycombe had carried
      # three false [WITHDRAWN?] and one false [DAYS] since it was registered. The
      # dangerous half is that a REAL withdrawal would have arrived in the same words. The
      # harness re-runs the OLD unfolded matching on the same fixture and requires it to
      # stay wrong, and carries the complement -- a variant genuinely gone must still be
      # reported. Feed and town tree are both synthetic: no dataset, no built map.
      # Added 2026-09-01.
      - name: Prove the refresh report's variant fold can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-variant-fold

      # The MIRROR of the fold above, and the one that cost a wrong recommendation.
      # That fix taught the report about variants the FEED folds together; this is a
      # consolidation the TOWN declares, where one drawn route stands for several GTFS
      # names. Wisbech draws First's `excel` and records subServices [A,B,C,D] because
      # bustimes shows them as one service -- and nothing read that field, so the diff
      # reported [ADD?] A/B/C plus [WITHDRAWN?] excel every month. Those four items read
      # exactly like a rebrand, and on 2026-09-03 they were read that way, far enough to
      # recommend rebuilding a town that was correct. The harness re-runs the OLD literal
      # matching on the same fixture and requires it to stay wrong, and carries the
      # complement the fix must not buy: when every sub-service really goes, the brand
      # must still report withdrawn. Added 2026-09-03.
      - name: Prove the refresh report's shipped consolidation can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-consolidation

      # OA-259: the only escape from [WITHDRAWN?] for a shipped route missing from the feed
      # was is_community(), which guesses from nine substrings in the OPERATOR'S NAME. It
      # fails on the first commercial counterexample -- Whippet's X1, absent from the ITM
      # East Anglia extract while nine other Whippet routes are in it -- so Huntingdon would
      # have sat on the towns-to-review list for ever over a service that runs. The
      # replacement is a DECLARATION, and this requires it to silence nothing without a
      # reason, nothing past its recheckBy, and nothing over a route the feed carries.
      # Added 2026-09-06.
      - name: Prove the notInBods declaration can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-not-in-bods

      # OA-269: [TIMETABLE] fires on routingHash OR tripCount and printed ONE sentence for
      # both -- "stops/frequency changed (trips P -> C)". routingHash means the road moved;
      # tripCount is the field gtfs_query.py's own docstring forbids tiering, weighting or
      # drawing from, because it counts service_id splits rather than journeys. Reading the
      # two as one cost a wrong verdict: St Neots Co-op was adjudicated rebuild-needed off
      # "trips 161 -> 126" while journeysPerWeek held at 326. In the other direction 7 of
      # the 21 findings on the 2026-08-31 scan printed an UNCHANGED count as their evidence.
      # This requires the message to name which trigger fired, and requires the count
      # trigger to survive -- dropping it is the wrong fix. Added 2026-09-07.
      - name: Prove the TIMETABLE trigger message can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-timetable-trigger

      # OA-259, the other half: the FOUR conventions a town uses for "known and not drawn"
      # are read by two checkers that cannot share a runtime, so the rule is written twice.
      # A comment saying they agree is a claim about a JOIN, and this is the join -- one
      # fixture through both, plus every real town file. It found a genuine disagreement on
      # its first run: the Python iterated a dict's KEYS where the JS checked isArray.
      # Added 2026-09-06.
      - name: Prove both checkers read the exclusion conventions the same way
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-known-off-parity

      # OA-141: redteam_source.js answered about the PARENT TOWN when run from a
      # place's own root, and said nothing about it. This cuts both fixes out and
      # requires the four guard tests to fail while the two CONTROLs hold.
      - name: Prove the redteam-source ambiguity guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-redteam-source

      # OA-166: the same tool decided REUSE from the S1/S2 pull TIMESTAMP, which is a
      # proxy for the question it was asking. It bought three ~100k-token red teams it
      # did not need -- a Wisbech S1 that only adjudicated the red team's own claim, an
      # Aldi S1 whose registration windows moved and whose 12 services did not, and a
      # Ramsey S2 that rebuilt drawn geometry. This reverts the decision to that rule
      # and requires the six guard tests to fail while the two CONTROLs hold.
      - name: Prove the redteam-source fingerprint can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-redteam-fingerprint

      # OA-019: derive_frequency.js tiers a place's LINE WEIGHTS, and fed one of the
      # three places whose S1 predates the frequency fields it returned "limited --
      # ends mid-afternoon" for every lane, from no data at all. This cuts the guard
      # out and requires the three guard tests to fail while the two CONTROLs hold
      # -- one of which is the lane whose MEASURED window is legitimately empty.
      - name: Prove the frequency stale-S1 guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-derive-frequency

      # OA-161: a hand-built S4 lost BOTH provenance stamps -- the engine hash and
      # the footer's build stamp -- because only the two rollouts ever wrote them,
      # and the byte gate cannot see it (ci-reference is seeded from the same
      # unstamped run). The check is a refusal at the stage boundary every route to
      # an S4 passes through. This cuts it out and requires the seven guard tests
      # to fail while the four CONTROLs hold.
      - name: Prove the S4 provenance-stamp guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-stage-stamps

      # OA-106's sibling, and it has NEVER run in CI. It reads the same stage.js
      # and it broke on 2026-08-29 the moment stage.js gained a relative require --
      # only its own CONTROL assertion distinguished "the harness broke the file"
      # from a successful falsification.
      - name: Prove the S4 output-existence guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-stage-commit

      # OA-310 item 2. `build-warnings.txt` is the only record that a generator
      # REFUSED to draw something -- those guards write to stderr and exit 0 -- and
      # until 2026-09-12 only the two rollouts wrote it, so an S4 built through the
      # stage order, the only path left for a config change, had none. The refusal
      # is SCOPED to a run whose predecessor declared a log, because a flat rule is
      # red on Huntingdon and Wisbech, whose latest runs legitimately have none.
      # Five of the seven tests are therefore CONTROLs asserting silence.
      - name: Prove the S4 build-warnings guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-stage-build-log

      # OA-329 fault A. `<map>/_latest/` is the folder that means CURRENT and
      # nothing in the S6 path wrote to it, so thirteen of twenty maps carried a
      # superseded verification report on 2026-09-13 -- one of them re-stranded
      # within the hour by an S6 that ran while the action was being written. The
      # refresh now happens at the commit boundary. This cuts the one call out and
      # requires the four mechanism tests to fail while the three CONTROLs hold --
      # the S5 one above all, since widening the refresh to every stage is the
      # plausible wrong fix and would break that control alone.
      - name: Prove the S6 _latest mirror refresh can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-stage-s6-mirror

      # OA-164. `pull` copies the whole run FOLDER while the manifest speaks only
      # of DECLARED outputs, so an undeclared file left in an older stage's folder
      # rides along and clobbers whatever the destination already holds. It cost
      # Beaconsfield Waitrose its intermediate stop names, its journey times and
      # its QR on 2026-08-29, and the byte gate could not see it because
      # ci-reference is re-synced from the same run. The CONTROLS matter more than
      # the guard tests here: refusing too much would break every build silently.
      - name: Prove the pull shadowing guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-stage-pull

      # OA-193. The drawn line comes from ONE travel direction and the stop ticks
      # from BOTH, so a route running a one-way loop through different streets pins
      # its ticks up to 3.5 km from where the bus goes -- with `fallbacks: []`, exit
      # 0 and every byte gate green, while Ramsey's sheet showed no bus at all to
      # Bury. `viaChain` is the opt-in repair. This runs a synthetic one-way loop
      # through match_routes.js and requires the default build to reproduce the
      # fault, the lever to remove it, and the lever to leave a route it does not
      # name byte-identical -- then disables the lever and requires the fix case to
      # fail. It needs no other repository: the fixture is four roads in a square.
      - name: Prove the one-way-loop via chain can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-via-chain

      # OA-200. The board's VENDORING verdict used to compare each skill source
      # against the portal's WORKING TREE, so it was a claim about whichever branch
      # a mutable local checkout happened to be on. On 2026-08-31 it named
      # engine/place/gen_internal.js as DRIFTED while main was in sync, and the
      # consequence a reader would have seen was a real complaint about a published
      # sheet -- a re-vendor PR was one command from being opened. This builds a
      # SYNTHETIC portal repository in the temp dir, so it needs neither the portal
      # nor buses-data, and it falsifies itself: the two cases about which tree was
      # read are re-run against a copy of status.js with the fix removed, and both
      # must go red for their own named reason.
      - name: Prove the portal vendoring verdict reads a ref, not a checkout
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-portal-drift

      # buses-data OA-355. The board's DEPLOY GRACE could not expire. It dated the
      # drift with `git log -1 <main>` -- the age of main's newest commit -- under a
      # comment asking how long the undeployed commit had been waiting, so on a
      # repository anything else merges into, every unrelated merge reset the clock
      # and `behind (grace)` never aged into the red `BEHIND`. Found by arithmetic on
      # a real morning: at 06:00Z on 2026-09-14 the oldest undeployed portal commit
      # was 16h old against a 12h grace while the board read 0h and exited 0, and
      # three changes then went live undescribed. It belongs in this secret-free tier
      # for the same reason as the step above -- it builds its own git repository and
      # serves its own fake live site on 127.0.0.1, so it reads neither the portal nor
      # busmaps.uk. Its fourth case re-runs the SAME fixture against a copy of
      # status.js with the old line restored and requires it to read amber, because a
      # fixture that reddens the fix proves nothing until it is shown to discriminate.
      - name: Prove the deploy grace can actually expire
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-deploy-grace

      # THE FILE-HYGIENE CHECKER NOW LIVES HERE (buses-data OA-241, 2026-09-04),
      # and it is in the SECRET-FREE tier deliberately. It was written in
      # buses-data, which is private; this repository and the portal are public,
      # so a private checker could not be run by either without CROSS_REPO_PAT2 --
      # and hanging a hygiene check off that token is exactly the coupling this
      # job exists to avoid. Moved here, all three repositories fetch it with no
      # secret at all -- and on the same day OA-246 made the same move for
      # `check-tables.mjs` and `check-doc-links.mjs`, which is why the four
      # documentation steps below are in this job rather than a `docs` job of
      # their own.
      #
      # FALSIFY IT FIRST. 24 cases, and each of the three exemption CLASSES is
      # broken in BOTH directions -- widening an exemption produces a false PASS
      # rather than a false finding, which is the half check-doc-links.mjs paid
      # for on 2026-09-01. Two of those cases exist only because the move made the
      # exemptions a repository's own `.file-hygiene.json`: a repo with no
      # declaration gets the BARE rules rather than a free pass, and a declaration
      # that does not parse is a refusal rather than a silent fallback.
      - name: Prove the file-hygiene checker can go red
        working-directory: skills
        run: node tools/prove-red-file-hygiene.mjs

      # NOT the mixed-line-ending half, which cannot fire here and is not meant
      # to: actions/checkout builds a uniform tree by construction, so mixed EOL
      # is a property of a WORKING TREE that only a pre-commit hook can ask about.
      # This step is genuinely narrower than the checker it runs.
      - name: Files carry no BOM, no trailing whitespace, no missing newline
        working-directory: skills
        run: node tools/check-file-hygiene.mjs

      # THE DOCUMENT CHECKERS NOW LIVE HERE TOO (buses-data OA-246, 2026-09-04),
      # and this job is where they belong for the same reason the hygiene checker
      # is here: no secret. They were a `docs` job of their own until today, and
      # the ONLY thing that made it a separate job was that both checkers lived in
      # buses-data, which is private -- so it carried a CROSS_REPO_PAT2 checkout
      # and would have gone down with that token on 22 November 2026. The checkers
      # moved into `tools/` beside `check-file-hygiene.mjs`, the checkout went
      # with them, and what is left is four steps with nothing to fetch.
      #
      # WHY THEY RUN HERE AND NOT IN BUSES-DATA, which is where they were written.
      # A check belongs in the suite that fires when its SUBJECT changes -- the
      # rule OA-218 settled for the falsification harnesses. Run only over there,
      # a glued row committed here would land green here and redden buses-data's
      # next unrelated run: the "rule that reddens the neighbour" shape. This
      # repository holds the engine, three bus SKILL.md files and every reference
      # page beside them, and it is the document set a session reads BEFORE doing
      # any work at all. A row appended past the end of its table sat in
      # `bus-work/SKILL.md` for a day, in the file documenting the tool that names
      # that failure shape.
      #
      # `if: ${{ !cancelled() }}` ON EVERY ONE, and read it as load-bearing rather
      # than boilerplate. It is what the separate job used to give for free: an
      # `npm ci` failure or a red unit test above must not hide a documentation
      # finding below it. It is the same condition buses-data's merged steps carry
      # under OA-245, and without it this merge trades a token for a check that
      # only reports when everything else has already passed.
      #
      # FALSIFY BOTH BEFORE TRUSTING EITHER. They are pointed at a corpus that is
      # not their author's, which is exactly when a checker that has quietly
      # stopped objecting looks identical to a clean tree. Both harnesses gained
      # cases on the day of the move that assert the DOCUMENT AND ROW COUNTS of a
      # default corpus, because coverage -- a confident total over a population
      # smaller than the truth -- is check-tables.mjs's own bug twice over and the
      # one thing a verdict cannot express.
      - name: Prove the table checker can go red
        if: ${{ !cancelled() }}
        working-directory: skills
        run: node tools/prove-red-tables.mjs

      - name: Prove the doc-link checker can go red
        if: ${{ !cancelled() }}
        working-directory: skills
        run: node tools/prove-red-doc-links.mjs

      # buses-data OA-300, the claude-skills round (2026-09-11). The checker and
      # this harness landed here on 2026-09-11 and ran in buses-data's gates.yml
      # ONLY, because that repository's corpus had been cleaned and this one's
      # had not: 69 short forms with nowhere to look across 45 documents, and a
      # gate that is red on day one is one somebody mutes in its first week. The
      # corpus is excused now -- `.doc-acronyms.json` at this root, 24 definitions
      # and six judgement groups -- so the gate lands.
      #
      # ITS OWN FALSE-PASS DIRECTION IS THE DANGEROUS ONE and is why the harness
      # runs first: widening what counts as "already defined" silences the finding
      # that should have fired, which is check-doc-links.mjs's 2026-09-01 lesson
      # in a second instrument. Every recogniser is falsified in BOTH directions,
      # and the counts are asserted, because a verdict cannot express coverage.
      - name: Prove the acronym checker can go red
        if: ${{ !cancelled() }}
        working-directory: skills
        run: node tools/prove-red-doc-acronyms.mjs

      # OA-259, second half (2026-09-06). check-exclusion-fields.mjs runs in buses-data's
      # own gates.yml, because its subject is that repository's town files; this harness
      # runs HERE, because its subject is the checker. The gate went green on the day it
      # landed — the five files using a deprecated exclusion field were migrated in the
      # same round — so it has never been seen to go red anywhere else, and its
      # load-bearing case is the one that keeps the migration honest: a SUPERSEDED S1 run
      # must be left alone, because an older run is a dated record and rewriting one would
      # be a lie about the past told to satisfy a gate about the present.
      - name: Prove the exclusion-field gate can go red
        if: ${{ !cancelled() }}
        working-directory: skills
        run: node tools/prove-red-exclusion-fields.mjs

      # buses-data OA-273 (2026-09-08). check-s6-claims.mjs asks whether every S6 claim —
      # a red-team claim about a SERVICE rather than artwork — has a home, and whether
      # the service-facts register contradicts any town file. Its coverage half can only
      # run on the laptop (verification.json is gitignored); its register half runs in
      # buses-data's gates.yml. This harness runs HERE because its subject is the
      # checker: a claim with no home is red, a parent town's decision reaches its
      # places, a decided entry over a silent map is red, and --register-only says what
      # it did not look at.
      - name: Prove the S6 claims gate can go red
        if: ${{ !cancelled() }}
        working-directory: skills
        run: node tools/prove-red-s6-claims.mjs

      # --tree, not --root: --root is flat by contract (prove-red-tables.mjs
      # drives it and asserts an exact row count), and this repository nests its
      # documents two deep and grows a folder whenever a skill is added.
      - name: Tables are still tables
        if: ${{ !cancelled() }}
        working-directory: skills
        run: node tools/check-tables.mjs --tree .

      # No flag at all, because this checker resolves its corpus from the
      # repository it is RUN FROM and this repository declares no `.doc-links.json`
      # -- which means the widest scope, its whole tree, exactly what `--root .`
      # gave it before the move.
      - name: Links, anchors, §n citations and documented commands
        if: ${{ !cancelled() }}
        working-directory: skills
        run: node tools/check-doc-links.mjs

      # No flag, for the same reason as the step above: the checker resolves its
      # corpus from the repository it is RUN FROM, and `.doc-acronyms.json` here
      # names no `dirs` -- so the scope is this repository's whole tracked corpus,
      # the widest there is, and the one shape a coverage bug cannot take.
      #
      # WHAT IT ASKS IS COMPREHENSION RATHER THAN STRUCTURE, which is what makes
      # it worth a step of its own beside two checkers that already read every
      # one of these documents. A link checker asks whether a pointer resolves
      # and a table checker whether a row is a row; neither can see a word. `EP`
      # had ten uses across the estate, all load-bearing, and no expansion
      # anywhere -- and it survived nine widenings of those two because no check
      # asked the question at all.
      - name: Every short form a reader meets is one they can look up
        if: ${{ !cancelled() }}
        working-directory: skills
        run: node tools/check-doc-acronyms.mjs

  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claude-skills (engine)
        uses: actions/checkout@v7
        with:
          path: skills

      # NO PREFLIGHT AND NO buses-data CHECKOUT, SINCE 2026-09-18 (buses-data
      # OA-398, R5 of the 2026-09-17 process review). Three things stood here: a
      # preflight that asked GitHub whether CROSS_REPO_PAT2 could still read
      # PeterC66/buses-data and printed the token's real expiry, the token-bearing
      # checkout of that private repository, and a long comment about a fetch that
      # status.js now does for itself.
      #
      # THE TOKEN DIES ON 22 NOVEMBER 2026, and `status` is a required check here
      # with strict mode and enforce_admins both on, so its expiry would have
      # blocked every pull request in this repository outright.
      #
      # BUT THE FLOATING REF WAS THE WORSE HALF. That checkout named no `ref:`, so
      # a verdict was about whatever buses-data's `main` held for the minutes this
      # job ran -- see the attribution step below for the run that measured it.
      #
      # AND IT CARRIED THE ORDERING TRAP (OA-341). `prove-red-held-back` needs a
      # DONOR town whose stamped engine IS the current one, and the stamp is a hash
      # of the engine's own files -- so ANY edit to ANY hashed engine file made
      # every town in that 21-map estate a non-donor at once, and the harness
      # exited 1 before a single case ran. Appending one comment line to `icons.js`
      # was enough. An engine pull request therefore opened RED and the only thing
      # that could clear it was a commit in the other repository.
      #
      # WHAT REPLACES IT is `make-bus-leaflet/test/fixtures/estate/`: five maps
      # this repository owns, redrawn and re-stamped by the same pull request that
      # moves the ink. `tools/estate-fixture.js` is the tool and its header is the
      # argument. What this job no longer does is gate twenty-one maps on every
      # engine push; that runs in buses-data's own `gates.yml`, on the rebuild that
      # follows, against an engine commit somebody chose.

      # THE ONLY OTHER REPOSITORY THIS JOB READS, AND IT IS PUBLIC. The history is
      # kept because the failure mode has not changed. This step once said "public"
      # while community-bus-maps was still private and passed no token: the
      # checkout failed with "Not Found" on every run before a single gate
      # executed, so the workflow reported red for the checkout rather than for
      # anything it was written to measure -- a gate that cannot run hides whatever
      # backlog it would have found. It then took CROSS_REPO_PAT2 until 2026-09-04,
      # when the portal really was made public (buses-data OA-236). Since
      # 2026-09-18 it is the last cross-repository checkout in this file.
      #
      # Still EXPECT A RED FOR REAL from here: the portal fixture rows DIFF
      # whenever the vendored engine is ahead of the portal's main, which is
      # exactly the state a re-vendoring pull request is in.
      #
      # AND SINCE 2026-09-18 IT CARRIES THE PORTAL'S OWN FIXTURE PACKS, under
      # `gate-fixtures/` (OA-398). `prove-red-gates`' portal arm mutates the
      # portal's engine and draws the portal's fixtures; the code came from here
      # and the data used to come from a private third repository, so an arm
      # entirely about the portal could not run without a credential that had
      # nothing to do with it. Code and data are now one checkout.
      - name: Checkout community-bus-maps (portal, public since 2026-09-03)
        uses: actions/checkout@v7
        with:
          repository: PeterC66/community-bus-maps
          path: community-bus-maps
          # FULL HISTORY, AND THE DEPLOYMENT ROW IS THE WHOLE REASON (2026-09-15).
          # This is the twin of buses-data a7a20e35, which fixed the identical
          # fault next door the night before. status.js dates the deploy backlog
          # with `log <deployed>..<ref>`, where <deployed> is the sha busmaps.uk
          # reports of itself -- a commit that is by definition OLDER than the
          # tip. actions/checkout fetches depth 1, so that sha is not in the clone
          # at all, the range is "unknown revision", and the row falls to its
          # documented `a backlog nobody can date is what a grace must not excuse`
          # path: BEHIND, ageHours null, undateable true. In CI that is a
          # structural "I could not look" rather than a measurement, and it fires
          # whenever any deploy is pending. Until OA-355 (e6a40a3, 2026-09-14) the
          # row dated the TIP, which a depth-1 clone can always name, so this
          # workflow had never needed history and nothing said so. THE FIRST RUN
          # THAT EVER TESTED IT WAS PR #16, whose status job went red on a
          # 5,919-line Python test PR that touches nothing this row measures.
          fetch-depth: 0

      # WITHOUT THIS THE PENDING RULE CANNOT FIRE HERE, WHICH IS THE ONLY PLACE
      # IT MATTERS (2026-08-31). actions/checkout fetches ONE branch, so
      # refs/remotes/origin holds `main` and nothing else. status.js treats a
      # re-vendor found on another fetched ref as amber-while-young rather than
      # DRIFTED -- the documented push order (buses-data BEFORE the portal PR)
      # guarantees a window where the portal is legitimately behind, and calling
      # that red made every engine rollout redden this workflow for no fault.
      # THE WITNESS CHECK STILL WANTS ONLY THE TIPS -- "do these bytes exist on
      # some pushed branch" -- BUT IT MAY NO LONGER SAY SO WITH `--depth=1`, which
      # this carried until 2026-09-15. `git fetch --depth=1` does not merely
      # decline to deepen: it SHALLOWS A COMPLETE REPOSITORY, and origin/main is
      # one of the refs/heads/* below. Measured in a throwaway clone on 2026-09-14
      # rather than reasoned about: origin/main went from 559 commits to 1 and
      # .git/shallow appeared, so the flag would have silently taken back the
      # fetch-depth: 0 above and left the deployment row exactly as red as it was.
      # Without it the same clone stays at 559 and writes no shallow file. The
      # cost of dropping it is the full history of a public repository, fetched
      # once, against a gate that could not otherwise reach a verdict.
      #
      # It must not be able to fail the job on its own. A repository with no
      # other branches is the normal case and returns nothing; a fetch that is
      # refused leaves the refs absent, which reads DRIFTED -- the pre-2026-08-31
      # verdict, and the safe direction to fail in. Neither is a reason to stop
      # the run, so this step swallows its own status and says what it found.
      - name: Fetch the portal's branch tips (so an open re-vendor reads pending, not DRIFTED)
        run: |
          git -C community-bus-maps fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || {
            echo "::notice::could not fetch the portal's branch tips - an in-flight re-vendor will read DRIFTED, which is the old behaviour and not a new failure"
            exit 0
          }
          echo "portal refs now visible to the vendoring row:"
          git -C community-bus-maps for-each-ref --format='  %(refname:short)  %(committerdate:relative)' refs/remotes/

      # WHICH TWO COMMITS IS THIS VERDICT ABOUT? It was WHICH THREE, and the one
      # that went is the one that made a verdict here unattributable.
      #
      # MEASURED, NOT SUPPOSED. Run 34607735390 on 2026-09-11 went red on the
      # quality ratchet four minutes after an engine commit that had nothing to do
      # with it. The cause was buses-data `dd5db17e`, pushed 95 minutes earlier in
      # another repository: it deliberately dropped route 101 from three Co-op
      # place sheets and left the ledger unaccepted, so three rows read REGRESSED.
      # Nothing in that run named the commit, or named buses-data at all -- the
      # failing step pipes status.js into the step summary, so the log says only
      # "exit code 1" -- and GitHub titles the failure email after the workflow's
      # static `name:`, so the mail said claude-skills. Establishing that the
      # engine was innocent took a downloaded gate-results artifact and a walk
      # through a second repository's history.
      #
      # That repository is gone from this job (OA-398) and the maps gated below are
      # a fixture this one owns, pinned by construction to the commit under test.
      # The portal still floats, and that is deliberate: *does today's portal still
      # carry today's engine* is a question about today, and pinning it would make
      # the vendoring row reproducible and blind to the drift it exists to catch.
      #
      # It cannot fail the job on its own: it reads SHAs out of checkouts two
      # earlier steps have already made, and it is the attribution rather than a
      # gate. Nothing here is asserted, so there is nothing to falsify.
      - name: Which two commits is this verdict about
        run: |
          {
            echo "### Checked out for this run"
            echo
            echo "| Repository | Ref | SHA |"
            echo "|---|---|---|"
            for d in skills community-bus-maps; do
              sha=$(git -C "$GITHUB_WORKSPACE/$d" rev-parse HEAD)
              ref=$(git -C "$GITHUB_WORKSPACE/$d" rev-parse --abbrev-ref HEAD)
              pin='floats on its default branch'
              [ "$d" = skills ] && pin='pinned to the triggering commit'
              echo "| \`$d\` | $ref — $pin | \`${sha:0:10}\` |"
            done
            echo
            echo "The maps gated below are this repository's own, under"
            echo "\`make-bus-leaflet/test/fixtures/estate/\`. buses-data is not checked out at all."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # WHICH NODE? THE ONE THE PRODUCT RUNS (buses-data OA-209, 2026-08-31).
      #
      # Derived rather than pinned, copied from buses-data's own `gates.yml`,
      # which learned it from the portal's `verify.yml`: "a hardcoded major keeps
      # passing after a base-image bump while quietly testing the wrong runtime --
      # a green check that has stopped meaning what its name says". This job
      # already checks out `community-bus-maps` above, so the Dockerfile is here
      # and there is nothing to pay for reading it.
      #
      # THE COST OF THE 20 THIS REPLACES WAS PRECISE, and it was coverage rather
      # than red. `node:sqlite` arrived in Node 22, so on the runner
      # `require('node:sqlite')` threw ERR_UNKNOWN_BUILTIN_MODULE and the two
      # register arms of `prove-s6-checks.js` section 13 printed NOT RUN on every
      # run ever made. The whole register path in `verify_report.js` -- the
      # OA-038 gazetteer join -- was therefore exercised on exactly one machine,
      # the laptop it was written on.
      #
      # Fails loudly if the FROM line cannot be read, because silently falling
      # back to a default is the same bug wearing a different hat.
      - name: What Node does the deployment image use?
        id: nodever
        working-directory: community-bus-maps
        run: |
          major=$(sed -n 's/^FROM node:\([0-9][0-9]*\).*/\1/p' Dockerfile | head -1)
          if [ -z "$major" ]; then
            echo "::error::could not read a Node major from community-bus-maps/Dockerfile's FROM line"
            exit 1
          fi
          echo "  Dockerfile FROM node:$major-slim -> running the gates on Node $major"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodever.outputs.major }}
          cache: npm
          cache-dependency-path: skills/make-bus-leaflet/package-lock.json

      - name: Install engine dependencies
        working-directory: skills/make-bus-leaflet
        run: npm ci

      # FALSIFY IT FIRST, as everything in this suite is. The fixture check below
      # is the thing the whole job now stands on: if it could not go red, an engine
      # change that moved ink would land with a fixture describing the engine
      # before it, every byte gate would still say PASS, and the first thing to
      # notice would be buses-data's real estate failing to reproduce days later in
      # another repository. Seven scratch copies of the fixture, each damaged a
      # different way; nothing under test/fixtures/estate is touched.
      - name: Prove the fixture-estate check can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-fixture-estate

      # THE FIXTURE ESTATE IS IN STEP WITH THIS ENGINE -- FIRST, because every byte
      # gate below is measured against it (buses-data OA-398). It asks two things:
      # that the current engine redraws all twelve fixture sheets, and that every
      # pack's `routes.json` stamp IS the current engine hash. The second is what
      # lets `prove-red-held-back` pose its fixture at all -- it needs a DONOR
      # whose stamp is current, and an edit to any hashed engine file used to empty
      # that set across a whole 21-map estate in another repository (OA-341). Here
      # the remedy is inside this pull request: `npm run fixture:estate -- --apply`,
      # committed with the engine edit that moved the ink.
      - name: The fixture estate is in step with this engine
        working-directory: skills/make-bus-leaflet
        run: npm run fixture:estate

      # Falsify the byte gates BEFORE trusting them. status.js below reports PASS
      # for every sheet in the estate; this step is what establishes that those
      # PASSes can turn into DIFFs at all. It mutates a scratch copy of each of
      # the five generators, never assets/ itself. Added 2026-08-27 (OA-129
      # Phase 0) because the byte gate had never been watched go red for any of
      # the five sheet types, and the refactor's whole method rests on it.
      # A held-back town is CHECKED against its own engine rather than excused, so
      # that check needs falsifying like any other -- and more than most, because
      # the thing it replaced was an excuse that could not go red at all.
      - name: Prove the held-back engine gate can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-held-back -- --buses "$GITHUB_WORKSPACE/skills/make-bus-leaflet/test/fixtures/estate"
      # AND THE SAME EIGHT CASES ON THE FIXTURE THIS FILE BUILDS ITSELF (OA-219).
      #
      # Six of those cases need a town whose sheets do not reproduce under the current
      # engine, and the estate supplies exactly one — Wisbech, held out of an
      # ink-moving rollout while portal update #139 is with the customer. When that is
      # answered it will supply none, and the harness falls back to synthesising a
      # two-commit engine and redrawing a sheet with it. A fallback that first runs on
      # the day it is needed is the shape this workflow has already paid for twice, so
      # it runs on every push instead: about 80 seconds, and it is the difference
      # between a fallback and a promise.
      - name: Prove it on the fixture the harness builds itself
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-held-back -- --buses "$GITHUB_WORKSPACE/skills/make-bus-leaflet/test/fixtures/estate" --synthetic

      - name: Prove the byte gates can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-gates -- --buses "$GITHUB_WORKSPACE/skills/make-bus-leaflet/test/fixtures/estate" --portal "$GITHUB_WORKSPACE/community-bus-maps"

      # THE S6 FALSIFICATION HAS MOVED TO buses-data (OA-398, 2026-09-18), and it
      # is a NARROWING, so the guarantee is re-established at the point of it.
      # `npm run test:prove-s6` seeds from a town's TRACKED S1/S2/S3 runs and its
      # redteam.json, and it is bound to one town by name -- its route families,
      # its headsigns, its stop codes. That is a claim about buses-data's estate
      # rather than about this engine, and the fixture estate here carries
      # ci-reference packs and one S3 run per map, which is deliberately not enough
      # to pose it. It now runs as a step in buses-data's own `gates.yml`, which is
      # where OA-218's rule puts it: a harness that reads the map tree runs in the
      # suite that fires when the tree changes. IT RAN NOWHERE ELSE BEFORE TODAY,
      # so moving it without adding it there would have deleted it -- which is the
      # fault OA-218 was itself filed about, where three documents said a harness
      # ran in CI and `git log -S` over the workflow returned nothing.

      # WHICH OF THESE BELONGS IN WHICH WORKFLOW (OA-218, 2026-09-01). The rule,
      # which nothing stated until now: a harness that reads the buses-data map tree
      # runs in BUSES-DATA's gates.yml, because that is the suite firing when the tree
      # changes; one that needs only the engine runs here; one that needs both runs in
      # both. The three below -- sweep, rollout-stamp, unrendered -- read that tree and
      # ran ONLY here, so a recut fixture or a rolled town could break them and the
      # suite that fires on exactly those changes was not looking. They now run in both.
      #
      # THE TEST THAT SETTLES IT IS NOT A GREP. Reading a script for `--buses` gets it
      # wrong: prove-red-portal-drift.js passes that flag to a board it points at an
      # empty tree it built itself, and does not read this estate at all. Run the
      # harness against an EMPTY buses tree -- if it still passes, it does not read the
      # repository and does not belong over there. Two of the five OA-218 first named
      # were wrong, and that is the test that said so.
      #
      # THE RENDER SWEEP RUNS ONLY IN buses-data NOW (OA-398), same shape as the S6
      # one above. Its run-4 case asserts an EXACT SET OF SEVEN MAPS BY NAME -- the
      # packs with no river geometry of their own -- which is a fact about that
      # estate and about nothing in this repository. Re-deriving the set for the
      # fixture estate would mean a second implementation of the engine's own
      # protection rule, and the harness's own header says why that is worse than
      # the constant: the first attempt at exactly that re-derivation confidently
      # listed a town the rule does not reach. It was ALREADY a step in
      # buses-data's `gates.yml`, so this is a removal rather than a move. What is
      # lost is that a change to `render_sweep.js` is no longer falsified until the
      # engine pin over there is bumped -- which is the rollout moment, and is when
      # that estate is rebuilt anyway.

      # And falsify the ROLLOUT stamp verdict (OA-179). This one has to be here
      # rather than in `unit`, because it needs a buses-data checkout — and it has
      # to be SOMEWHERE, because nothing else in CI can ever see this verdict work:
      # it writes nothing, it does not move an exit code, and the whole estate is on
      # the current engine, so it never fires by accident. Six cases over both
      # rollout tools, four of them controls. It builds its fixture from tracked
      # files only (manifest + latest S3 + ci-reference), which is exactly what this
      # checkout has.
      - name: Prove the rollout stamp verdict can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-rollout-stamp -- --buses "$GITHUB_WORKSPACE/skills/make-bus-leaflet/test/fixtures/estate"

      # The same argument again, for the verdict that says a committed S4 was never
      # rendered (OA-198). Both rollout tools commit S4 and render S5 as a separate
      # step, with a blocking-warning stop in between; the state that stop leaves is
      # a manifest advertising an S4 whose stored sheets every byte gate PASSES
      # against, and no JPG anywhere. The fast path then reports UP-TO-DATE and
      # skips the map for ever. Every map on the estate is rendered today, which is
      # the silence this verdict has to keep, so the only way to see it work is to
      # provoke it. Six cases, FOUR of them controls, over BOTH rollout tools —
      # the row was written about places and towns have the identical stop.
      - name: Prove the unrendered-S4 verdict can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-unrendered -- --buses "$GITHUB_WORKSPACE/skills/make-bus-leaflet/test/fixtures/estate"

      # And falsify the severity contract that decides whether a build may ship at
      # all. Every rule in build_log.js is a regex over a MESSAGE, and a regex that
      # has never been watched fail is a green light nobody has earned. Added
      # 2026-08-28 with OA-065, which promoted the buried-mapNotes warning to
      # BLOCKING: promoting a warning is only safe with both halves — that it starts
      # green on the real corpus, and that it can still go red. Needs no repository
      # but this one, so it runs even when the cross-repo checkout is unavailable.
      - name: Prove the build-warning severities can still go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-build-log

      # A route NUMBER is not unique, and indexing on it is an index AND a silent
      # de-duplication that nothing distinguishes afterwards. Wisbech runs two 46s,
      # so `gtfs_refresh_report.py` had been diffing the Lynx one against BODS every
      # month and had never once checked the Stagecoach East one -- eleven services
      # indexed into ten entries, every route appearing exactly once, report complete.
      # This harness reproduces the OLD logic alongside the new one and asserts the
      # old stays SILENT on the mutant, so it shows the fix distinguishes itself from
      # the code that had the bug rather than merely agreeing with today's file.
      # BODS is stubbed and the fixture is synthetic: no dataset, no built map, and
      # ubuntu-latest already has python3. Added 2026-08-28 with OA-134/OA-097.
      - name: Prove the route-number collision guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-route-collision

      # OA-204: gtfs_query.py read operating days from the `calendar` row and folded
      # calendar_dates additions in only for a service with NO calendar row. GTFS lets
      # both tables define the answer, so a Mon-Fri base that adds every weekend as an
      # exception read Mon-Fri -- High Wycombe route 300, which would have printed 'no
      # Sunday bus' onto a sheet where 12 Sunday journeys run. No byte gate could see it:
      # the gate compares the drawing with ci-reference, not with the world. This harness
      # re-runs the OLD derivation beside the new one and requires it to stay wrong, so
      # the fix is shown to differ from the code that had the bug. Feed is synthetic and
      # in-memory: no dataset, no built map. Added 2026-08-31.
      - name: Prove the operating-days resolution can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-days-resolution

      # OA-223: gtfs_refresh_report.py folded 1A/1B into 1 and 32A into 32 -- right, and
      # what stops 301S being proposed as new every month -- recorded what it folded in
      # `variants`, and then read that set nowhere. A town that SHIPS a variant as a
      # displayed service was told every month that it had been withdrawn, and the base's
      # week became the union of services the town separates. High Wycombe had carried
      # three false [WITHDRAWN?] and one false [DAYS] since it was registered. The
      # dangerous half is that a REAL withdrawal would have arrived in the same words. The
      # harness re-runs the OLD unfolded matching on the same fixture and requires it to
      # stay wrong, and carries the complement -- a variant genuinely gone must still be
      # reported. Feed and town tree are both synthetic: no dataset, no built map.
      # Added 2026-09-01.
      - name: Prove the refresh report's variant fold can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-variant-fold

      # The MIRROR of the fold above, and the one that cost a wrong recommendation.
      # That fix taught the report about variants the FEED folds together; this is a
      # consolidation the TOWN declares, where one drawn route stands for several GTFS
      # names. Wisbech draws First's `excel` and records subServices [A,B,C,D] because
      # bustimes shows them as one service -- and nothing read that field, so the diff
      # reported [ADD?] A/B/C plus [WITHDRAWN?] excel every month. Those four items read
      # exactly like a rebrand, and on 2026-09-03 they were read that way, far enough to
      # recommend rebuilding a town that was correct. The harness re-runs the OLD literal
      # matching on the same fixture and requires it to stay wrong, and carries the
      # complement the fix must not buy: when every sub-service really goes, the brand
      # must still report withdrawn. Added 2026-09-03.
      - name: Prove the refresh report's shipped consolidation can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-consolidation

      # OA-259: the only escape from [WITHDRAWN?] for a shipped route missing from the feed
      # was is_community(), which guesses from nine substrings in the OPERATOR'S NAME. It
      # fails on the first commercial counterexample -- Whippet's X1, absent from the ITM
      # East Anglia extract while nine other Whippet routes are in it -- so Huntingdon would
      # have sat on the towns-to-review list for ever over a service that runs. The
      # replacement is a DECLARATION, and this requires it to silence nothing without a
      # reason, nothing past its recheckBy, and nothing over a route the feed carries.
      # Added 2026-09-06.
      - name: Prove the notInBods declaration can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-not-in-bods

      # OA-269: [TIMETABLE] fires on routingHash OR tripCount and printed ONE sentence for
      # both -- "stops/frequency changed (trips P -> C)". routingHash means the road moved;
      # tripCount is the field gtfs_query.py's own docstring forbids tiering, weighting or
      # drawing from, because it counts service_id splits rather than journeys. Reading the
      # two as one cost a wrong verdict: St Neots Co-op was adjudicated rebuild-needed off
      # "trips 161 -> 126" while journeysPerWeek held at 326. In the other direction 7 of
      # the 21 findings on the 2026-08-31 scan printed an UNCHANGED count as their evidence.
      # This requires the message to name which trigger fired, and requires the count
      # trigger to survive -- dropping it is the wrong fix. Added 2026-09-07.
      - name: Prove the TIMETABLE trigger message can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-timetable-trigger

      # THE EXCLUSION-PARITY JOIN RUNS IN buses-data NOW, and only the REAL half
      # moved (OA-398). This step set `BUSES_DIR` to the buses-data checkout so the
      # harness ran its synthetic fixture AND every real town file; the fixture
      # estate here carries no `S1-services` runs at all, so the real half exits 1
      # on `the estate really has towns to check`, which is the harness correctly
      # refusing to answer a question it cannot ask. The synthetic half still runs,
      # in the `unit` job above, where it has always run and needs nothing.

      # THE STRAY-OUTPUT SWEEP RUNS ONLY IN buses-data NOW (OA-398). It walks the
      # map tree for run folders holding a later stage's output -- a property of
      # that estate's gitignored S4/S5/S6 folders, which this repository's fixture
      # does not have and never will, so a step here would have been green for
      # ever. A check that cannot fail where it runs is the thing this estate keeps
      # paying for. buses-data's own `gates.yml` gained the step in this change.

      # ONE WALK, BOTH OUTPUTS (2026-09-03). This was two steps -- `--json >
      # gate-results.json` for the artifact, then `--md >> $GITHUB_STEP_SUMMARY`
      # for the table a human reads -- and the second re-walked all 20 maps,
      # re-hashed the engine and re-fetched the live version header to recompute
      # an answer the first one already had. 38 s of a 314 s job here, 37 s of 466 s
      # in buses-data, on every push. `--json-out` writes the payload to the file
      # and carries on to print the board, so the two outputs come from one walk
      # and cannot disagree.
      #
      # WHAT IS LOST, said plainly: the summary no longer appears when an EARLIER
      # step failed, because there is no longer a second `always()` invocation to
      # print it. buses-data's copy of this file documents that board as a trap
      # rather than a feature -- it rendered "a full, green-looking board" while
      # the tests above it were red, which is why that file's own comment says the
      # step summary is NOT where to read the verdict from. A red gate still
      # writes both outputs before exiting non-zero, which is the case that matters.
      - name: Run gates (JSON + step summary)
        working-directory: skills/make-bus-leaflet
        run: |
          node assets/status.js --buses "$GITHUB_WORKSPACE/skills/make-bus-leaflet/test/fixtures/estate" --portal "$GITHUB_WORKSPACE/community-bus-maps" --md --json-out gate-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-results
          path: skills/make-bus-leaflet/gate-results.json
