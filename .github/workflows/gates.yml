name: Bus leaflet gates

# Mirror of buses-data's workflow of the same name, triggered from this side
# (the engine repo) instead. Runs the same status.js gate suite so an engine
# change gets checked immediately rather than waiting for the next buses-data
# push or the nightly schedule over there.
#
# Requires the CROSS_REPO_PAT2 secret, added here as a repo secret: a GitHub PAT
# with read access to BOTH private repos this workflow checks out --
# PeterC66/buses-data AND PeterC66/community-bus-maps. Naming only the first is
# what caused this workflow to be red from 2026-08-04 to 2026-08-24: the token in
# the store could read buses-data and could not see the portal, so the run died at
# the portal checkout having gated nothing. Widen the token, not this list.
#
# ONE token, FOUR stores, and they renew together: buses-data Actions,
# claude-skills Actions, community-bus-maps Actions, community-bus-maps
# Dependabot -- the portal's verify.yml runs on pull_request, and a Dependabot PR
# cannot read an Actions secret. The 2026-08-21 rotation updated three of the
# four and missed one, which is the six weeks of red described above.
# CROSS_REPO_PAT2 expires Sunday 22 November 2026; when it does, this workflow,
# buses-data's copy and the portal's verify all fail at once, at their
# preflights. Its predecessor CROSS_REPO_PAT is no longer named by any workflow
# in any of the three repos (migrated 2026-08-24).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The unit suite needs NO repository but this one, so it must not sit behind the
  # cross-repo checkout: a CROSS_REPO_PAT2 expiry would otherwise take 423 tests
  # down with the byte gates, and the token expires on a known date (22 Nov 2026).
  # buses-data learned exactly this and split its `docs` job out for the same
  # reason. Added 2026-08-29 with OA-141, on measuring that `node --test` had
  # never run in CI at all -- 30 test files and 423 assertions whose only evidence
  # of passing was somebody remembering to run them on the laptop they were
  # written on. The three harnesses below are the ones that need no dataset and no
  # built map; the rest stay in `status`, where their fixtures are.
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claude-skills (engine)
        uses: actions/checkout@v7
        with:
          path: skills

      # WHICH NODE? THE ONE THE PRODUCT RUNS (buses-data OA-209, 2026-08-31).
      #
      # This said 20 until 2026-08-31 while the deployment image has been
      # `FROM node:24-slim` since August. A hardcoded major keeps passing after a
      # base-image bump while quietly testing a runtime the product never runs --
      # the same lesson buses-data's `gates.yml` and the portal's `verify.yml`
      # both carry, and this was the third repository it had not reached.
      #
      # The `status` job below DERIVES the major from the portal's Dockerfile,
      # which is the better pattern and the one to copy. This job cannot: it
      # checks out `skills` alone, and reading the Dockerfile would mean giving
      # the one job with NO secrets a cross-repo token -- so a CROSS_REPO_PAT2
      # expiry would take the unit suite down with the byte gates, which is
      # exactly the coupling the docs job in buses-data was split out to avoid.
      # A literal that is WRONG and self-maintaining beats a literal that is
      # right today and maintained by remembering; here the trade goes the other
      # way, so it is written down instead.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: skills/make-bus-leaflet/package-lock.json

      - name: Install engine dependencies
        working-directory: skills/make-bus-leaflet
        run: npm ci

      - name: Unit suite
        working-directory: skills/make-bus-leaflet
        run: npm test

      # Falsification harnesses that need no other repository. Each breaks its own
      # subject on purpose and asserts WHICH tests go red while a named CONTROL
      # stays green -- a suite that only ever goes green proves nothing about the
      # guard it is pointed at.
      - name: Prove the build-warning severities can still go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-build-log

      # The line-count ratchet (buses-data OA-224, Tier 2.1). gen_internal.js was cut
      # 3,933 -> 2,550 on 2026-08-27 with a written rule that new logic goes in a
      # module; it was 3,293 by 2026-09-01. A rule in prose is a wish. The harness
      # runs FIRST: a ratchet nobody has watched go red is a number in a file.
      - name: Prove the line-count ratchet can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-line-ratchet

      - name: The generators have not grown past their ceilings
        working-directory: skills/make-bus-leaflet
        run: npm run gate:line-ratchet

      # THE MUTATION SUITE, WHICH HAD NEVER RUN HERE. `npm test` above is
      # `node --test` -- it proves the unit tests pass. This breaks the engine on
      # purpose, once per mutation (read the count off the run, not off this
      # comment -- it said 226 for five days after it was 249), and requires each
      # mutation to redden the test that
      # names it: it proves the unit tests can FAIL, which is the only thing that
      # makes their green mean anything. `git log -S "prove-red.js"` over this
      # file returns nothing, so until 2026-09-02 the only machine that had ever
      # seen it was the one it was written on -- the exact fault OA-218 fixed for
      # the OTHER two harnesses on 2026-08-28, one file short. Found by
      # `gate:wiring` below, on its first run. ~90 s, no other repository.
      - name: Prove the unit suite can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red

      # The convention `_engine.js` and test/README.md have both stated since
      # August, now with something enforcing it. A suite that requires its subject
      # out of assets/ directly never sees the mutation copy, so it is green about
      # code it never ran -- `seed_prev_s4`'s first draft did exactly that and both
      # its mutations SURVIVED. The census runs in `npm test`; this proves it can
      # fail, including the case where the mutation table has become unreadable and
      # the JOIN has nothing left to join. ~5 s.
      - name: Prove the engine-indirection census can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-engine-indirection

      - name: Prove the S4 run-directory guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-stage-run-dir

      - name: Prove the design-key register check can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-design-keys

      - name: Every design.* key the engine reads is in the register
        working-directory: skills/make-bus-leaflet
        run: npm run gate:design-keys

      - name: Every tracked file is LF
        working-directory: skills/make-bus-leaflet
        run: npm run gate:line-endings

      # The check that keeps this list honest. Every runnable tool must have an
      # npm script, every test:/gate: script must be in a workflow step or
      # declared with a reason, and CI must invoke each one THROUGH its script
      # rather than rebuilding the command -- four python harnesses were `python`
      # in package.json and `python3` here, so `npm run <name>` and the step of
      # the same name were different commands.
      # Falsify the scheduling check before trusting it. It is a check whose
      # subject is OTHER checks being scheduled, so if it stops finding things it
      # reports the healthiest possible state about a repository where nothing
      # runs. Seven cases on scratch repositories under the temp dir, ~2 s. The
      # one that matters is a control rather than a break: a tool named only in a
      # COMMENT must still count as unscheduled, because this workflow is heavily
      # commented and a grep over it would call every mention a schedule.
      - name: Prove the scheduling check can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-wiring

      - name: Every gate and harness is scheduled, and scheduled by name
        working-directory: skills/make-bus-leaflet
        run: npm run gate:wiring

      # BUS-WORK'S FOUR HARNESSES, which ran nowhere but this laptop until
      # 2026-09-02 (buses-data OA-224, Tier 2.3). Each builds its own scratch
      # tree under the temp dir and imports node builtins only, so they need no
      # install, no secrets and no other repository -- which is exactly why there
      # was never a reason for them to be missing, only an absence of anywhere
      # obvious to put them. bus-work now has a package.json that NAMES them.
      - name: Prove the commitment reminders can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-commitments

      - name: Prove the concurrency verdicts can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-concurrency

      - name: Prove the correspondence reminders can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-correspondence

      - name: Prove the refresh-review row can go red
        working-directory: skills/bus-work
        run: npm run test:prove-red-refresh-review

      - name: Prove the route-number collision guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-route-collision

      # OA-204: gtfs_query.py read operating days from the `calendar` row and folded
      # calendar_dates additions in only for a service with NO calendar row. GTFS lets
      # both tables define the answer, so a Mon-Fri base that adds every weekend as an
      # exception read Mon-Fri -- High Wycombe route 300, which would have printed 'no
      # Sunday bus' onto a sheet where 12 Sunday journeys run. No byte gate could see it:
      # the gate compares the drawing with ci-reference, not with the world. This harness
      # re-runs the OLD derivation beside the new one and requires it to stay wrong, so
      # the fix is shown to differ from the code that had the bug. Feed is synthetic and
      # in-memory: no dataset, no built map. Added 2026-08-31.
      - name: Prove the operating-days resolution can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-days-resolution

      # OA-223: gtfs_refresh_report.py folded 1A/1B into 1 and 32A into 32 -- right, and
      # what stops 301S being proposed as new every month -- recorded what it folded in
      # `variants`, and then read that set nowhere. A town that SHIPS a variant as a
      # displayed service was told every month that it had been withdrawn, and the base's
      # week became the union of services the town separates. High Wycombe had carried
      # three false [WITHDRAWN?] and one false [DAYS] since it was registered. The
      # dangerous half is that a REAL withdrawal would have arrived in the same words. The
      # harness re-runs the OLD unfolded matching on the same fixture and requires it to
      # stay wrong, and carries the complement -- a variant genuinely gone must still be
      # reported. Feed and town tree are both synthetic: no dataset, no built map.
      # Added 2026-09-01.
      - name: Prove the refresh report's variant fold can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-variant-fold

      # OA-141: redteam_source.js answered about the PARENT TOWN when run from a
      # place's own root, and said nothing about it. This cuts both fixes out and
      # requires the four guard tests to fail while the two CONTROLs hold.
      - name: Prove the redteam-source ambiguity guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-redteam-source

      # OA-166: the same tool decided REUSE from the S1/S2 pull TIMESTAMP, which is a
      # proxy for the question it was asking. It bought three ~100k-token red teams it
      # did not need -- a Wisbech S1 that only adjudicated the red team's own claim, an
      # Aldi S1 whose registration windows moved and whose 12 services did not, and a
      # Ramsey S2 that rebuilt drawn geometry. This reverts the decision to that rule
      # and requires the six guard tests to fail while the two CONTROLs hold.
      - name: Prove the redteam-source fingerprint can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-redteam-fingerprint

      # OA-019: derive_frequency.js tiers a place's LINE WEIGHTS, and fed one of the
      # three places whose S1 predates the frequency fields it returned "limited --
      # ends mid-afternoon" for every lane, from no data at all. This cuts the guard
      # out and requires the three guard tests to fail while the two CONTROLs hold
      # -- one of which is the lane whose MEASURED window is legitimately empty.
      - name: Prove the frequency stale-S1 guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-derive-frequency

      # OA-161: a hand-built S4 lost BOTH provenance stamps -- the engine hash and
      # the footer's build stamp -- because only the two rollouts ever wrote them,
      # and the byte gate cannot see it (ci-reference is seeded from the same
      # unstamped run). The check is a refusal at the stage boundary every route to
      # an S4 passes through. This cuts it out and requires the seven guard tests
      # to fail while the four CONTROLs hold.
      - name: Prove the S4 provenance-stamp guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-stage-stamps

      # OA-106's sibling, and it has NEVER run in CI. It reads the same stage.js
      # and it broke on 2026-08-29 the moment stage.js gained a relative require --
      # only its own CONTROL assertion distinguished "the harness broke the file"
      # from a successful falsification.
      - name: Prove the S4 output-existence guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-stage-commit

      # OA-164. `pull` copies the whole run FOLDER while the manifest speaks only
      # of DECLARED outputs, so an undeclared file left in an older stage's folder
      # rides along and clobbers whatever the destination already holds. It cost
      # Beaconsfield Waitrose its intermediate stop names, its journey times and
      # its QR on 2026-08-29, and the byte gate could not see it because
      # ci-reference is re-synced from the same run. The CONTROLS matter more than
      # the guard tests here: refusing too much would break every build silently.
      - name: Prove the pull shadowing guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-stage-pull

      # OA-193. The drawn line comes from ONE travel direction and the stop ticks
      # from BOTH, so a route running a one-way loop through different streets pins
      # its ticks up to 3.5 km from where the bus goes -- with `fallbacks: []`, exit
      # 0 and every byte gate green, while Ramsey's sheet showed no bus at all to
      # Bury. `viaChain` is the opt-in repair. This runs a synthetic one-way loop
      # through match_routes.js and requires the default build to reproduce the
      # fault, the lever to remove it, and the lever to leave a route it does not
      # name byte-identical -- then disables the lever and requires the fix case to
      # fail. It needs no other repository: the fixture is four roads in a square.
      - name: Prove the one-way-loop via chain can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-via-chain

      # OA-200. The board's VENDORING verdict used to compare each skill source
      # against the portal's WORKING TREE, so it was a claim about whichever branch
      # a mutable local checkout happened to be on. On 2026-08-31 it named
      # engine/place/gen_internal.js as DRIFTED while main was in sync, and the
      # consequence a reader would have seen was a real complaint about a published
      # sheet -- a re-vendor PR was one command from being opened. This builds a
      # SYNTHETIC portal repository in the temp dir, so it needs neither the portal
      # nor buses-data, and it falsifies itself: the two cases about which tree was
      # read are re-run against a copy of status.js with the fix removed, and both
      # must go red for their own named reason.
      - name: Prove the portal vendoring verdict reads a ref, not a checkout
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-portal-drift

  # THE DOCUMENTS IN THIS REPOSITORY HAD NEVER BEEN CHECKED BY ANYTHING
  # (buses-data OA-222, 2026-09-01). buses-data's `check-tables.mjs` had been
  # widened six times -- Documentation/, Development Docs/, open-actions/,
  # Correspondence/, _archive/ -- and every widening was within that repository.
  # This repo holds the engine, three bus SKILL.md files and every reference page
  # beside them: 337 table rows and 32 documents, none of them ever looked at, and
  # it is the document set a session reads BEFORE doing any work at all. A row
  # appended past the end of its table sat in `bus-work/SKILL.md` for a day, in
  # the file documenting the tool that names that failure shape.
  #
  # WHY IT RUNS HERE AND NOT IN BUSES-DATA, which is where the checkers live. A
  # check belongs in the suite that fires when its SUBJECT changes -- the rule
  # OA-218 settled for the falsification harnesses, applied one repository along.
  # Run only over there, a glued row committed here would land green here and
  # redden buses-data's next unrelated run, which is the "rule that reddens the
  # neighbour" shape this project has already paid for. The checkers are FETCHED
  # rather than copied: a copy would be a checker owning someone else's rule, and
  # the docs job in buses-data would drift away from this one silently.
  #
  # THE COST OF THE TOKEN IS ACCEPTED, not overlooked. This job cannot be in the
  # secret-free tier the way `unit` is, because the checker it runs is in a
  # private repository -- so a CROSS_REPO_PAT2 expiry (22 Nov 2026) takes it down
  # with `status`. It is split out from `status` anyway, so a portal checkout
  # failure or a byte-gate red does not hide a documentation finding, and it needs
  # only ONE of the two repos that job needs.
  #
  # IT DID NOT LAND RED, and that was measured rather than hoped for. Pointed at
  # this tree for the first time, `check-doc-links.mjs` reported 33 findings; 21
  # were the checker's own -- its five folder-declaration forms were the five
  # buses-data happens to use -- and the widenings that fixed them are falsified
  # in `prove-red-doc-links.mjs` in both directions. The remaining 12 were real
  # and were fixed first: two links that climbed out of this repository and
  # resolved only on Peter's laptop, a dead same-document anchor, and commands
  # naming a script by a path that ran from no documented folder.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout claude-skills (the documents under test)
        uses: actions/checkout@v7
        with:
          path: skills

      # Only Documentation/ -- the two checkers and their harnesses. buses-data
      # carries the whole map estate and none of it is read here.
      - name: Checkout the checkers from buses-data
        uses: actions/checkout@v7
        with:
          repository: PeterC66/buses-data
          token: ${{ secrets.CROSS_REPO_PAT2 }}
          path: buses-data
          sparse-checkout: Documentation

      # Both checkers are dependency-free ESM reading only node:fs and node:path,
      # so unlike the byte gates there is nothing to install and no runtime the
      # product depends on. Pinned to match the `unit` job above rather than
      # derived from the portal's Dockerfile, which would mean a third checkout.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Falsify both checkers BEFORE trusting either. They are being pointed at a
      # new corpus, which is exactly when a checker that has quietly stopped
      # objecting looks identical to a clean tree.
      - name: Prove the table checker can go red
        working-directory: buses-data
        run: node Documentation/prove-red-tables.mjs

      - name: Prove the doc-link checker can go red
        working-directory: buses-data
        run: node Documentation/prove-red-doc-links.mjs

      # --tree, not --root: --root is flat by contract (prove-red-tables.mjs
      # drives it and asserts an exact row count), and this repository nests its
      # documents two deep and grows a folder whenever a skill is added.
      - name: Tables are still tables
        working-directory: buses-data
        run: node Documentation/check-tables.mjs --tree "$GITHUB_WORKSPACE/skills"

      # --root here, because THIS checker already walks recursively from it.
      - name: Links, anchors, §n citations and documented commands
        working-directory: buses-data
        run: node Documentation/check-doc-links.mjs --root "$GITHUB_WORKSPACE/skills"

  status:
    runs-on: ubuntu-latest
    steps:
      # Fail fast and legibly: without this, an absent or wrongly-scoped
      # CROSS_REPO_PAT2 surfaces as `Not Found` from actions/checkout, which
      # reads like a deleted repository rather than a missing permission. That
      # is exactly how this workflow's six weeks of red read. Mirrors the
      # preflight in buses-data's gates.yml, over this side's two repos.
      - name: Preflight -- can the PAT see both private repos?
        env:
          PAT: ${{ secrets.CROSS_REPO_PAT2 }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::CROSS_REPO_PAT2 is not set on this repository. Add it under Settings -> Secrets and variables -> Actions, with read access to PeterC66/buses-data and PeterC66/community-bus-maps."
            exit 1
          fi
          # Ask the credential when it dies rather than trusting a date typed
          # into the comment above. GitHub returns a
          # github-authentication-token-expiration header on any request
          # authenticated with a PAT that expires. Until 2026-08-24 the date in
          # this file came from a previous session's notes and had never been
          # read back off the token itself; a third token in the account,
          # carrying a third date, is what exposed that. Now every run prints it.
          exp=$(curl -sS -D - -o /dev/null -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/PeterC66/buses-data" | sed -n 's/^github-authentication-token-expiration: *//Ip' | tr -dc '[:print:]')
          if [ -n "$exp" ]; then
            echo "  this token expires: $exp"
          else
            echo "::warning::GitHub reported no token-expiry header, so the date in this file's header comment is unverified."
          fi
          fail=0
          for repo in PeterC66/buses-data PeterC66/community-bus-maps; do
            code=$(curl -s -o /dev/null -w '%{http_code}'               -H "Authorization: Bearer $PAT"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$repo")
            if [ "$code" = "200" ]; then
              echo "  ok   $repo"
            else
              echo "::error::CROSS_REPO_PAT2 cannot read $repo (HTTP $code). Widen the token's repository access."
              fail=1
            fi
          done
          exit $fail

      - name: Checkout claude-skills (engine)
        uses: actions/checkout@v7
        with:
          path: skills

      # NO STEP HERE FETCHES THE HELD-BACK ENGINE ANY MORE, AND THAT IS THE FIX
      # (OA-217, 2026-09-01). status.js gates a held-back town against the engine it
      # was BUILT with, which means checking that commit out of the skills clone --
      # and actions/checkout clones one commit deep, so the object is not there. The
      # first remedy was a step in this file that fetched the shas by name. It was
      # written into ONE of the two workflows that run this suite, the sentence "CI
      # is green on it" was true of that one, and the other went red about a sheet
      # that was perfectly good.
      #
      # Two YAML files in two repositories held a setup requirement belonging to a
      # function in a third, and nothing made them agree. So the function does it
      # itself: a missing object is now a fetch and a retry inside status.js, timed
      # out at 60s, reporting the original error if it cannot recover. On any clone
      # that already has the commit it never runs. Falsified in prove-red-status.js,
      # which runs above, against a genuinely one-deep clone -- and the mutation that
      # removes the retry reproduces this workflow's 2026-09-01 red exactly.
      - name: Checkout buses-data
        uses: actions/checkout@v7
        with:
          repository: PeterC66/buses-data
          token: ${{ secrets.CROSS_REPO_PAT2 }}
          path: buses-data

      # community-bus-maps is PRIVATE, and this step used to say "public" and pass no
      # token. The checkout failed with "Not Found" on every run, before a single gate
      # executed, so this workflow has been reporting red for the checkout rather than
      # for anything it was written to measure -- a gate that cannot run hides whatever
      # backlog it would have found. It takes the same CROSS_REPO_PAT2 the buses-data
      # checkout above it takes; the preflight at the top of this job now names a
      # scope problem instead of letting it surface as "Not Found". Still EXPECT A
      # RED FOR REAL from here: the portal fixture rows DIFF whenever the vendored
      # engine is ahead of the portal's main, which is exactly the state a
      # re-vendoring PR is in, and this row has never once been exercised.
      - name: Checkout community-bus-maps (portal, private)
        uses: actions/checkout@v7
        with:
          repository: PeterC66/community-bus-maps
          token: ${{ secrets.CROSS_REPO_PAT2 }}
          path: community-bus-maps

      # WITHOUT THIS THE PENDING RULE CANNOT FIRE HERE, WHICH IS THE ONLY PLACE
      # IT MATTERS (2026-08-31). actions/checkout fetches ONE branch, so
      # refs/remotes/origin holds `main` and nothing else. status.js treats a
      # re-vendor found on another fetched ref as amber-while-young rather than
      # DRIFTED -- the documented push order (buses-data BEFORE the portal PR)
      # guarantees a window where the portal is legitimately behind, and calling
      # that red made every engine rollout redden this workflow for no fault.
      # Fetching only the branch TIPS, depth 1: this is a witness check, "do
      # these bytes exist on some pushed branch", and it never needs history.
      #
      # It must not be able to fail the job on its own. A repository with no
      # other branches is the normal case and returns nothing; a fetch that is
      # refused leaves the refs absent, which reads DRIFTED -- the pre-2026-08-31
      # verdict, and the safe direction to fail in. Neither is a reason to stop
      # the run, so this step swallows its own status and says what it found.
      - name: Fetch the portal's branch tips (so an open re-vendor reads pending, not DRIFTED)
        run: |
          git -C community-bus-maps fetch --depth=1 --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || {
            echo "::notice::could not fetch the portal's branch tips - an in-flight re-vendor will read DRIFTED, which is the old behaviour and not a new failure"
            exit 0
          }
          echo "portal refs now visible to the vendoring row:"
          git -C community-bus-maps for-each-ref --format='  %(refname:short)  %(committerdate:relative)' refs/remotes/

      # WHICH NODE? THE ONE THE PRODUCT RUNS (buses-data OA-209, 2026-08-31).
      #
      # Derived rather than pinned, copied from buses-data's own `gates.yml`,
      # which learned it from the portal's `verify.yml`: "a hardcoded major keeps
      # passing after a base-image bump while quietly testing the wrong runtime --
      # a green check that has stopped meaning what its name says". This job
      # already checks out `community-bus-maps` above, so the Dockerfile is here
      # and there is nothing to pay for reading it.
      #
      # THE COST OF THE 20 THIS REPLACES WAS PRECISE, and it was coverage rather
      # than red. `node:sqlite` arrived in Node 22, so on the runner
      # `require('node:sqlite')` threw ERR_UNKNOWN_BUILTIN_MODULE and the two
      # register arms of `prove-s6-checks.js` section 13 printed NOT RUN on every
      # run ever made. The whole register path in `verify_report.js` -- the
      # OA-038 gazetteer join -- was therefore exercised on exactly one machine,
      # the laptop it was written on.
      #
      # Fails loudly if the FROM line cannot be read, because silently falling
      # back to a default is the same bug wearing a different hat.
      - name: What Node does the deployment image use?
        id: nodever
        working-directory: community-bus-maps
        run: |
          major=$(sed -n 's/^FROM node:\([0-9][0-9]*\).*/\1/p' Dockerfile | head -1)
          if [ -z "$major" ]; then
            echo "::error::could not read a Node major from community-bus-maps/Dockerfile's FROM line"
            exit 1
          fi
          echo "  Dockerfile FROM node:$major-slim -> running the gates on Node $major"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nodever.outputs.major }}
          cache: npm
          cache-dependency-path: skills/make-bus-leaflet/package-lock.json

      - name: Install engine dependencies
        working-directory: skills/make-bus-leaflet
        run: npm ci

      # Falsify the byte gates BEFORE trusting them. status.js below reports PASS
      # for every sheet in the estate; this step is what establishes that those
      # PASSes can turn into DIFFs at all. It mutates a scratch copy of each of
      # the five generators, never assets/ itself. Added 2026-08-27 (OA-129
      # Phase 0) because the byte gate had never been watched go red for any of
      # the five sheet types, and the refactor's whole method rests on it.
      # A held-back town is CHECKED against its own engine rather than excused, so
      # that check needs falsifying like any other -- and more than most, because
      # the thing it replaced was an excuse that could not go red at all.
      - name: Prove the held-back engine gate can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-held-back -- --buses "$GITHUB_WORKSPACE/buses-data"
      # AND THE SAME EIGHT CASES ON THE FIXTURE THIS FILE BUILDS ITSELF (OA-219).
      #
      # Six of those cases need a town whose sheets do not reproduce under the current
      # engine, and the estate supplies exactly one — Wisbech, held out of an
      # ink-moving rollout while portal update #139 is with the customer. When that is
      # answered it will supply none, and the harness falls back to synthesising a
      # two-commit engine and redrawing a sheet with it. A fallback that first runs on
      # the day it is needed is the shape this workflow has already paid for twice, so
      # it runs on every push instead: about 80 seconds, and it is the difference
      # between a fallback and a promise.
      - name: Prove it on the fixture the harness builds itself
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-held-back -- --buses "$GITHUB_WORKSPACE/buses-data" --synthetic

      - name: Prove the byte gates can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-gates -- --buses "$GITHUB_WORKSPACE/buses-data"

      # Falsify the S6 verification checks too. Four of them were rewritten on
      # 2026-08-27 (OA-129 Phase 2) because they were manufacturing findings that
      # looked like defects and were not, and the failure mode of quietening a
      # noisy check is a check that no longer says anything -- which looks exactly
      # like success. Every case here comes in a pair: quiet on the artefact, loud
      # on a real fault of the same kind. It seeds from the TRACKED S1/S2/S3 runs
      # plus redteam.json, so it runs on a fresh clone; the S4/S5/S6 run folders
      # are gitignored and CI has none of them.
      - name: Prove the S6 checks can still go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-s6 -- --buses "$GITHUB_WORKSPACE/buses-data"

      # WHICH OF THESE BELONGS IN WHICH WORKFLOW (OA-218, 2026-09-01). The rule,
      # which nothing stated until now: a harness that reads the buses-data map tree
      # runs in BUSES-DATA's gates.yml, because that is the suite firing when the tree
      # changes; one that needs only the engine runs here; one that needs both runs in
      # both. The three below -- sweep, rollout-stamp, unrendered -- read that tree and
      # ran ONLY here, so a recut fixture or a rolled town could break them and the
      # suite that fires on exactly those changes was not looking. They now run in both.
      #
      # THE TEST THAT SETTLES IT IS NOT A GREP. Reading a script for `--buses` gets it
      # wrong: prove-red-portal-drift.js passes that flag to a board it points at an
      # empty tree it built itself, and does not read this estate at all. Run the
      # harness against an EMPTY buses tree -- if it still passes, it does not read the
      # repository and does not belong over there. Two of the five OA-218 first named
      # were wrong, and that is the test that said so.
      #
      # The sweep asks the one question the byte gate does not: could each map be
      # re-rendered under STRICT_GUARDS=1, which is what every portal render that
      # goes public sets. Its harness was the ONE falsification harness never wired
      # in here, and on 2026-08-28 it was found RED -- its run-3 control asserted a
      # no-op that depended on a side file whose writer the OA-137 fix had deleted.
      # A harness nobody runs is a harness nobody can trust. It works on a fresh
      # clone because latestRunDir() already falls back to the tracked ci-reference/
      # when the gitignored S4 run folder is absent, which was verified against
      # `git archive HEAD` rather than assumed.
      - name: Prove the render sweep can still go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-sweep -- --buses "$GITHUB_WORKSPACE/buses-data"

      # And falsify the ROLLOUT stamp verdict (OA-179). This one has to be here
      # rather than in `unit`, because it needs a buses-data checkout — and it has
      # to be SOMEWHERE, because nothing else in CI can ever see this verdict work:
      # it writes nothing, it does not move an exit code, and the whole estate is on
      # the current engine, so it never fires by accident. Six cases over both
      # rollout tools, four of them controls. It builds its fixture from tracked
      # files only (manifest + latest S3 + ci-reference), which is exactly what this
      # checkout has.
      - name: Prove the rollout stamp verdict can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-rollout-stamp -- --buses "$GITHUB_WORKSPACE/buses-data"

      # The same argument again, for the verdict that says a committed S4 was never
      # rendered (OA-198). Both rollout tools commit S4 and render S5 as a separate
      # step, with a blocking-warning stop in between; the state that stop leaves is
      # a manifest advertising an S4 whose stored sheets every byte gate PASSES
      # against, and no JPG anywhere. The fast path then reports UP-TO-DATE and
      # skips the map for ever. Every map on the estate is rendered today, which is
      # the silence this verdict has to keep, so the only way to see it work is to
      # provoke it. Six cases, FOUR of them controls, over BOTH rollout tools —
      # the row was written about places and towns have the identical stop.
      - name: Prove the unrendered-S4 verdict can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-unrendered -- --buses "$GITHUB_WORKSPACE/buses-data"

      # And falsify the severity contract that decides whether a build may ship at
      # all. Every rule in build_log.js is a regex over a MESSAGE, and a regex that
      # has never been watched fail is a green light nobody has earned. Added
      # 2026-08-28 with OA-065, which promoted the buried-mapNotes warning to
      # BLOCKING: promoting a warning is only safe with both halves — that it starts
      # green on the real corpus, and that it can still go red. Needs no repository
      # but this one, so it runs even when the cross-repo checkout is unavailable.
      - name: Prove the build-warning severities can still go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-build-log

      # A route NUMBER is not unique, and indexing on it is an index AND a silent
      # de-duplication that nothing distinguishes afterwards. Wisbech runs two 46s,
      # so `gtfs_refresh_report.py` had been diffing the Lynx one against BODS every
      # month and had never once checked the Stagecoach East one -- eleven services
      # indexed into ten entries, every route appearing exactly once, report complete.
      # This harness reproduces the OLD logic alongside the new one and asserts the
      # old stays SILENT on the mutant, so it shows the fix distinguishes itself from
      # the code that had the bug rather than merely agreeing with today's file.
      # BODS is stubbed and the fixture is synthetic: no dataset, no built map, and
      # ubuntu-latest already has python3. Added 2026-08-28 with OA-134/OA-097.
      - name: Prove the route-number collision guard can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-route-collision

      # OA-204: gtfs_query.py read operating days from the `calendar` row and folded
      # calendar_dates additions in only for a service with NO calendar row. GTFS lets
      # both tables define the answer, so a Mon-Fri base that adds every weekend as an
      # exception read Mon-Fri -- High Wycombe route 300, which would have printed 'no
      # Sunday bus' onto a sheet where 12 Sunday journeys run. No byte gate could see it:
      # the gate compares the drawing with ci-reference, not with the world. This harness
      # re-runs the OLD derivation beside the new one and requires it to stay wrong, so
      # the fix is shown to differ from the code that had the bug. Feed is synthetic and
      # in-memory: no dataset, no built map. Added 2026-08-31.
      - name: Prove the operating-days resolution can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-days-resolution

      # OA-223: gtfs_refresh_report.py folded 1A/1B into 1 and 32A into 32 -- right, and
      # what stops 301S being proposed as new every month -- recorded what it folded in
      # `variants`, and then read that set nowhere. A town that SHIPS a variant as a
      # displayed service was told every month that it had been withdrawn, and the base's
      # week became the union of services the town separates. High Wycombe had carried
      # three false [WITHDRAWN?] and one false [DAYS] since it was registered. The
      # dangerous half is that a REAL withdrawal would have arrived in the same words. The
      # harness re-runs the OLD unfolded matching on the same fixture and requires it to
      # stay wrong, and carries the complement -- a variant genuinely gone must still be
      # reported. Feed and town tree are both synthetic: no dataset, no built map.
      # Added 2026-09-01.
      - name: Prove the refresh report's variant fold can go red
        working-directory: skills/make-bus-leaflet
        run: npm run test:prove-red-variant-fold

      # OA-164, REPORTED not gated: eight files exist today, the pull guard already
      # stops them doing harm, and a check red on the day it lands gets muted. It is
      # here so "harmless" stays something somebody looked at.
      - name: Sweep for run folders holding a later stage's output
        working-directory: skills/make-bus-leaflet
        run: node assets/stray_outputs.js --buses "$GITHUB_WORKSPACE/buses-data"

      - name: Run gates (JSON)
        working-directory: skills/make-bus-leaflet
        run: |
          node assets/status.js --buses "$GITHUB_WORKSPACE/buses-data" --portal "$GITHUB_WORKSPACE/community-bus-maps" --json > gate-results.json

      - name: Gate summary
        if: always()
        working-directory: skills/make-bus-leaflet
        run: node assets/status.js --buses "$GITHUB_WORKSPACE/buses-data" --portal "$GITHUB_WORKSPACE/community-bus-maps" --md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-results
          path: skills/make-bus-leaflet/gate-results.json
