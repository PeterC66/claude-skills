name: PR train

# MOVES THE AUTO-MERGE QUEUE ALONG, ONE PULL REQUEST AT A TIME (2026-09-27).
#
# `main` is protected with strict mode: a pull request merges only when it carries
# `main`'s tip AND `unit` and `status` are green on that tip. So every merge leaves
# every other open pull request BEHIND, and GitHub's auto-merge does not update a
# branch that is behind -- it waits. On 2026-09-27 Peter worked a queue by hand,
# update-branch, wait about seven minutes, merge, next, and a new queue had formed
# by the time he finished. He ruled the same day that merging a pull request here
# is routine and needs no judgement of his. It is a loop, so this is the loop.
#
# WHAT IT DOES, EACH TIME IT RUNS: among the open pull requests with auto-merge ON,
# if one is already on its way (up to date and its checks running, or up to date
# and green and about to merge) it does nothing. Otherwise it updates the OLDEST
# one that is behind and whose checks have not already failed, and starts the gates
# on it. When that one merges, the push to `main` runs this again and it takes the
# next. One at a time on purpose: updating them all together makes the first to go
# green merge and leaves the rest behind again, each having paid a full run for
# nothing.
#
# WHAT IT LEAVES ALONE: a pull request without auto-merge, a draft, one whose checks
# failed, and one that conflicts with `main`. It never resolves a conflict and never
# merges anything itself -- GitHub's auto-merge does that, on green. A conflict or a
# red is a session's to fix: it is named as a warning in this run's log, the train
# moves on to the next pull request rather than stalling behind it, and the open
# pull request stays on the bus-work worklist through `pr_sweep.mjs` until somebody
# does. That includes a conflict GitHub only discovers when the update is asked
# for: a refused update-branch is a warning and the next candidate, not a red run.
#
# Enabling auto-merge is the declaration that a pull request is finished --
# `gh pr merge <n> --squash --auto`. A session still working leaves it off.
#
# WHY IT STARTS THE GATES ITSELF: a branch update made with the workflow's own
# token triggers no `pull_request` run -- GitHub's rule against workflows starting
# workflows -- but `workflow_dispatch` is exempt, and the check runs it creates on
# the branch tip are the `unit` and `status` that protection asks for by name. No
# secret is named here, as none is anywhere in this repository.
#
# The hourly run is the backstop for a queue nothing woke: an update that had not
# landed when the dispatch was asked, or a run that died.

on:
  push:
    branches: [main]
  pull_request_target:
    types: [auto_merge_enabled]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: pr-train
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - name: Update the oldest waiting auto-merge pull request, unless one is already on its way
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          list() {
            gh pr list --state open --base main --limit 100 \
              --json number,headRefName,headRefOid,mergeStateStatus,autoMergeRequest,isDraft,statusCheckRollup \
              | jq '[.[] | select(.autoMergeRequest != null and (.isDraft | not))] | sort_by(.number)
                    | map(. + {
                        pending: ([.statusCheckRollup[] | select((.status // "COMPLETED") != "COMPLETED" or .state == "PENDING")] | length > 0),
                        failed:  ([.statusCheckRollup[] | select((.conclusion // .state // "") | IN("FAILURE","ERROR","CANCELLED","TIMED_OUT","ACTION_REQUIRED","STARTUP_FAILURE"))] | length > 0),
                        checks:  (.statusCheckRollup | length)
                      })'
          }
          # GitHub computes mergeStateStatus lazily, and just after a push to main it reads UNKNOWN.
          for i in 1 2 3 4 5 6; do
            prs=$(list)
            jq -e 'any(.[]; .mergeStateStatus == "UNKNOWN")' <<<"$prs" >/dev/null || break
            sleep 10
          done
          jq -r '.[] | "#\(.number) \(.mergeStateStatus) checks=\(.checks) pending=\(.pending) failed=\(.failed)"' <<<"$prs"

          jq -r '.[] | select(.mergeStateStatus == "DIRTY") | "::warning::#\(.number) conflicts with main; skipped until a session rebases it"' <<<"$prs"
          jq -r '.[] | select(.failed) | "::warning::#\(.number) has failed checks; skipped until a session fixes it"' <<<"$prs"

          onway=$(jq -r '[.[] | select(.mergeStateStatus != "BEHIND" and .mergeStateStatus != "DIRTY" and (.failed | not) and (.pending or .mergeStateStatus == "CLEAN"))][0].number // empty' <<<"$prs")
          if [ -n "$onway" ]; then echo "#$onway is already on its way; nothing to do."; exit 0; fi

          # Up to date but never checked: an update whose dispatch was missed. Start its gates.
          unchecked=$(jq -c '[.[] | select(.mergeStateStatus != "BEHIND" and .mergeStateStatus != "DIRTY" and .checks == 0)][0] // empty' <<<"$prs")
          if [ -n "$unchecked" ]; then
            n=$(jq -r .number <<<"$unchecked"); ref=$(jq -r .headRefName <<<"$unchecked")
            gh workflow run gates.yml --ref "$ref" </dev/null
            echo "#$n was up to date with no checks; started the gates on $ref."; exit 0
          fi

          # Oldest first; a refused update (a conflict found only now) is a warning and the next candidate.
          while IFS= read -r next; do
            n=$(jq -r .number <<<"$next"); ref=$(jq -r .headRefName <<<"$next"); old=$(jq -r .headRefOid <<<"$next")
            if ! gh api -X PUT "repos/$GH_REPO/pulls/$n/update-branch" -f expected_head_sha="$old" </dev/null >/dev/null; then
              echo "::warning::#$n could not be updated (most likely a conflict with main); skipped until a session rebases it"
              continue
            fi
            # The update is asynchronous; dispatch only once the branch has moved, or the gates run on the old tip.
            now=$old
            for i in $(seq 1 30); do
              now=$(gh pr view "$n" --json headRefOid --jq .headRefOid </dev/null)
              [ "$now" != "$old" ] && break
              sleep 4
            done
            if [ "$now" = "$old" ]; then echo "::warning::#$n did not move after update-branch; the hourly run will retry."; exit 0; fi
            gh workflow run gates.yml --ref "$ref" </dev/null
            echo "Updated #$n ($ref) to $now and started its gates."
            exit 0
          done < <(jq -c '.[] | select(.mergeStateStatus == "BEHIND" and (.failed | not)) | {number, headRefName, headRefOid}' <<<"$prs")
          echo "Nothing is waiting."
